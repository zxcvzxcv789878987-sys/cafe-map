<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>그림별 움직임 시험</title>
<style>

/* 배치: 화면 전체가 지도. 위에 검색창과 필터 칩 한 줄만 떠 있다.
   그 밖의 것(지역 고르기, 브랜드 고르기, 목록, 카페 정보)은 필요할 때만 뜨는 카드 하나에 번갈아 나온다.
   PC에서는 카드가 왼쪽 위에, 휴대폰에서는 아래에서 올라온다. */
:root {
  --bg: #f1f3f6;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --ink: #14171c;
  --ink-2: #4b5462;
  --ink-3: #8b93a1;
  --line: #e7eaee;
  --line-2: #d3d8df;
  --inv: #14171c;
  --on-inv: #ffffff;
  --c-low: #f59f0a;
  --c-fr: #2463eb;
  --c-ind: #8a5a3c;
  --ok: #0f8a5a;
  --hi: #1d5fe0;
  --pri: #6a5ae0;      /* 기본색: 누른 단추와 주요 단추. 지역을 칠하는 색(--area)과 같은 보랏빛 파랑(인디고) */
  --on-pri: #ffffff;
  --area: #6a5ae0;   /* 고른 지역을 칠하는 색. 카페 점(파랑, 주황, 갈색)이나 지도의 초록, 물색과 겹치지 않는 보라 */
  --sh-1: 0 1px 2px rgba(20, 23, 28, .10), 0 2px 10px rgba(20, 23, 28, .10);
  --sh-2: 0 2px 6px rgba(20, 23, 28, .08), 0 14px 36px rgba(20, 23, 28, .18);
  color-scheme: light;
  --font: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font); font-size: 14px; line-height: 1.45; color: var(--ink); background: var(--bg); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--c-fr); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#app { position: relative; height: 100%; }
#map { position: absolute; inset: 0; background: var(--bg); }
#dots { position: absolute; left: 0; top: 0; pointer-events: none; }

/* 위쪽 한 줄: 검색 + 칩 */
#bar { position: absolute; z-index: 20; top: 14px; left: 14px; right: 14px; display: flex; align-items: flex-start; gap: 10px; pointer-events: none; }
#bar > * { pointer-events: auto; }
.search { display: flex; align-items: center; gap: 8px; width: 300px; flex: none; height: 44px; padding: 0 6px 0 14px; background: var(--surface); border-radius: 14px; box-shadow: var(--sh-1); color: var(--ink-3); }
.srow { display: flex; gap: 8px; flex: none; }
#menuBtn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; background: var(--surface); border-radius: 14px; box-shadow: var(--sh-1); color: var(--ink); }
#menuBtn:hover { background: var(--surface-2); }
#menuBtn svg.i { width: 20px; height: 20px; }
.search:focus-within { color: var(--ink); box-shadow: var(--sh-1), 0 0 0 2px var(--ink); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); font-size: 15px; }
.search input::placeholder { color: var(--ink-3); }
/* 아이폰은 글씨가 16px보다 작은 입력 칸을 누르면 화면 전체를 확대해 버린다. 손가락으로 쓰는 기기에서는 16px로 맞춘다. */
@media (max-width: 760px), (pointer: coarse) { .search input { font-size: 16px; } }
.search input::-webkit-search-cancel-button { display: none; }
#qClear { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-3); }
#qClear:hover { background: var(--surface-2); color: var(--ink); }
#chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; padding-top: 3px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 999px; background: var(--surface); box-shadow: var(--sh-1); font-size: 14px; font-weight: 600; white-space: nowrap; flex: none; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed=true] { background: var(--pri); color: var(--on-pri); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.chip svg.i { width: 16px; height: 16px; }
.chip[data-act=want][aria-pressed=true] svg.i { fill: currentColor; }
/* 새로 오픈은 켜면 찜의 분홍과 같은 느낌의 연둣빛 초록. */
.chip[data-act=fresh][aria-pressed=true] { background: #37b24d; color: #fff; }
.chip[data-act=fresh][aria-pressed=true] svg.i { fill: currentColor; }
/* 찜은 켜면 분홍빛 빨강(지도의 하트 표시와 같은 색). */
.chip[data-act=want][aria-pressed=true], .opt.heart[aria-pressed=true] { background: #e64980; border-color: #e64980; color: #fff; }
.chip .sub { display: grid; place-items: center; width: 22px; height: 22px; margin-right: -7px; border-radius: 50%; opacity: .75; }
.chip .sub:hover { opacity: 1; background: rgba(128, 128, 128, .35); }
.chip.crumb { padding: 0 5px 0 12px; gap: 1px; cursor: default; }
.chip.crumb button { height: 28px; padding: 0 7px; border-radius: 999px; font-weight: 600; opacity: .68; display: inline-flex; align-items: center; gap: 3px; }
.chip.crumb button.cur { opacity: 1; }
.chip.crumb button:hover { opacity: 1; background: rgba(128, 128, 128, .32); }
.chip.crumb > svg.i { width: 12px; height: 12px; opacity: .5; }
.chip.crumb > svg.i:first-child { width: 16px; height: 16px; opacity: 1; margin-right: 3px; }
.chip.crumb button svg.i { width: 14px; height: 14px; }
.chip.ghost { background: none; box-shadow: none; color: var(--ink-2); padding: 0 8px; text-shadow: 0 0 6px var(--surface), 0 0 6px var(--surface); }
.chip.ghost:hover { color: var(--ink); }

/* 카드 하나: 메뉴, 목록, 카페 정보가 번갈아 나온다 */
#panel { position: absolute; z-index: 25; width: 360px; max-height: calc(100% - 96px); display: flex; flex-direction: column; background: var(--surface); border-radius: 18px; box-shadow: var(--sh-2); overflow: hidden; }
.ph { display: flex; align-items: center; gap: 6px; padding: 12px 10px 8px 16px; min-height: 52px; flex: none; }
.ph h2 { flex: 1; min-width: 0; margin: 0; font-size: 16px; font-weight: 750; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph h2 small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 6px; font-variant-numeric: tabular-nums; }
.ib { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); flex: none; }
.ib:hover { background: var(--surface-2); color: var(--ink); }
.ph .ib.back { margin-left: -8px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.sort { display: flex; background: var(--surface-2); border-radius: 9px; padding: 2px; flex: none; }
.sort button { font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 5px 10px; border-radius: 7px; }
.sort button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); }

.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 9px 16px; }
.row:hover { background: var(--surface-2); }
.pin { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 13px; font-weight: 750; background: var(--c); color: var(--t, #fff); }
.pin svg.i { width: 16px; height: 16px; }
.pin.logo { background: #fff; box-shadow: 0 0 0 2px var(--c); }
.pin.logo img { width: 68%; height: 68%; object-fit: contain; border-radius: 3px; }
.pin.logo.full img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row .name { font-weight: 650; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .meta > span + span { margin-left: 9px; }
.fsec output .onote { display: block; margin-top: 2px; font-size: 12px; font-weight: 500; color: var(--ink-3); }
.facts dd small.bigmark { color: #6a5ae0; font-weight: 650; }
.row .tag { flex: none; color: var(--ok); display: grid; }
.row .tag svg.i { width: 16px; height: 16px; }
.sec { padding: 12px 16px 4px; font-size: 12px; font-weight: 650; color: var(--ink-3); letter-spacing: .03em; }
.note { margin: 0; padding: 8px 16px 10px; font-size: 12.5px; color: var(--ink-3); }
.ask { margin: 2px 14px 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-2); }
.ask .btn { flex: none; background: var(--pri); color: var(--on-pri); }
.empty { padding: 28px 24px 30px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty b { font-size: 15px; color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 11px; font-weight: 650; font-size: 14px; background: var(--surface-2); text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--line); }
.btn.pri { background: var(--pri); color: var(--on-pri); }
.btn.pri:hover { opacity: .88; background: var(--pri); }
.btn.sm { height: 34px; font-size: 13px; padding: 0 12px; }
.btn[aria-pressed=true] { background: var(--pri); color: var(--on-pri); }

.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 0 10px 8px; flex: none; }
.crumbs button { font-size: 13.5px; font-weight: 600; color: var(--ink-3); padding: 5px 6px; border-radius: 7px; }
.crumbs button:hover { background: var(--surface-2); color: var(--ink); }
.crumbs button.on { color: var(--ink); }
.crumbs svg.i { width: 13px; height: 13px; color: var(--ink-3); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 2px 14px 12px; }
.cell { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.cell:hover { border-color: var(--ink-3); }
.cell.on { background: var(--pri); border-color: var(--pri); color: var(--on-pri); }
.cell.on small { color: inherit; opacity: .7; }
/* 맨 위의 "전체" 단추(전국, 경기 전체, 수원시 전체 등)는 모두 같은 보랏빛 파랑으로 맞춘다. 지도에서 고른 지역을 칠하는 색과 같다. */
.cell.all { grid-column: 1 / -1; background: rgba(106, 90, 224, .09); border-color: rgba(106, 90, 224, .28); color: var(--area); }
.cell.all span { font-weight: 750; }
.cell.all small { color: inherit; opacity: .75; }
.cell.all.on { background: var(--area); border-color: var(--area); color: #fff; }
/* 전국 단추: 다른 칸 두 개 너비로 길게 놓고, 한 단계 위라는 것이 보이게 옅은 보라 바탕을 깐다. */
.cell.nation { justify-content: center; }
.cell span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cell small { flex: none; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cell:disabled { opacity: .4; cursor: default; }

.inset { margin: 0 14px 6px; width: auto; height: 40px; box-shadow: none; background: var(--surface-2); flex: none; }
.inset:focus-within { box-shadow: 0 0 0 2px var(--ink); }
.pick { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 16px; }
.pick:hover { background: var(--surface-2); }
.pick .box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex: none; color: transparent; }
.pick[aria-pressed=true] .box { background: var(--pri); border-color: var(--pri); color: var(--on-pri); }
.pick .box svg.i { width: 14px; height: 14px; stroke-width: 2.6; }
.pick .name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .pin { width: 28px; height: 28px; font-size: 12.5px; }
.brow { display: flex; align-items: center; }
.brow .pick { flex: 1; min-width: 0; padding-right: 6px; }
.pinbtn { width: 38px; height: 38px; display: grid; place-items: center; flex: none; margin-right: 8px; border-radius: 50%; color: var(--line-2); }
.pinbtn:hover { background: var(--surface-2); color: var(--ink-2); }
.pinbtn[aria-pressed=true] { color: var(--ink); }
.pinbtn[aria-pressed=true] svg.i { fill: currentColor; }
.pinbar { padding: 0 14px 8px; flex: none; display: flex; flex-direction: column; gap: 6px; }
.pinbar .btn { width: 100%; }
.pick small { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 12.5px; }

.pad { padding: 2px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.pad output { font-size: 20px; font-weight: 750; font-variant-numeric: tabular-nums; }
.pad output small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 6px; }
.pad p { margin: 0; font-size: 12.5px; color: var(--ink-3); }
input[type=range] { width: 100%; accent-color: var(--ink); margin: 0; }

.detail { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 12px; }
.detail h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1.3; overflow-wrap: anywhere; }
.kind { display: flex; align-items: center; gap: 7px; margin-top: 4px; color: var(--ink-2); font-size: 13.5px; font-weight: 550; }
.kind .dot { width: 9px; height: 9px; border-radius: 50%; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 0; align-items: center; }
.facts dt { color: var(--ink-3); font-size: 13px; }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.facts dd b { font-weight: 700; font-variant-numeric: tabular-nums; }
.facts dd small { color: var(--ink-3); font-size: 12.5px; }
/* 넓이와 같은 줄에 적는 "개업" 이름표 */
.facts dd .k2 { color: var(--ink-3); font-size: 13px; margin-left: 8px; }
.facts dd small.newmark { display: inline-flex; align-items: center; gap: 3px; color: #2b9a41; font-weight: 650; }
.facts dd small.newmark svg.i { width: 13px; height: 13px; fill: currentColor; }
/* 준비 중일 수 있어요: 새로 열었어요와 같은 모양의 주황 글씨. 누르면 설명이 잠깐 뜬다. */
.facts dd .omark { display: inline-flex; align-items: center; gap: 3px; padding: 0; background: none; color: #e8590c; font-size: 12.5px; font-weight: 650; }
.facts dd .omark svg.i { width: 13px; height: 13px; }
/* 카드 맨 아래에 붙어 있는 단추 줄(필터의 적용하기) */
.pfoot { flex: none; padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
.pfoot .btn { width: 100%; height: 46px; border-radius: 12px; font-size: 15px; font-weight: 700; }
.pfoot .btn small { font-weight: 600; opacity: .7; margin-left: 2px; }
/* 메뉴 카드 */
.macc { display: flex; align-items: center; gap: 10px; }
.macc .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.macc .who b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.macc .who small { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mlist a { color: inherit; }
/* 환경설정에서 여러 개 중 하나를 고르는 줄 */
.mopt { display: flex; flex-direction: column; gap: 8px; font-weight: 650; font-size: 15px; }
.mopt .sort { display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; border-radius: 11px; }
.mopt .sort button { height: 32px; font-size: 13px; border-radius: 8px; padding: 0 4px; white-space: nowrap; }
.mnick { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.mnick span { font-size: 13px; color: var(--ink-2); }
.mnick b { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mnick + .link,
.macc + .link { align-self: flex-start; margin-left: -6px; }
.mlist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-2); }
.link { font-size: 12.5px; font-weight: 650; color: var(--ink-3); padding: 1px 6px; border-radius: 6px; }
.link:hover { background: var(--surface-2); color: var(--ink); }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 14px; height: 6px; border-radius: 3px; background: var(--line-2); }
.meter i.on { background: var(--ok); }
.mine { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--line); }
.mine span { font-size: 12.5px; color: var(--ink-3); margin-right: auto; }
/* 필터 카드: 위에 노트북 작업 조건, 아래에 브랜드. 브랜드의 탭과 검색은 목록을 내려도 위에 붙어 있다. */
.fsec { padding: 2px 16px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.fsec .sub { display: flex; flex-direction: column; gap: 8px; padding-bottom: 2px; }
.fsec .sub p { margin: 0; font-size: 12.5px; color: var(--ink-3); }
.fsec output { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.fsec output small { font-size: 12.5px; font-weight: 500; color: var(--ink-3); margin-left: 6px; }
.ftitle { font-size: 12px; font-weight: 650; color: var(--ink-3); letter-spacing: .03em; padding-top: 10px; }
.bhead { position: sticky; top: 0; z-index: 1; background: var(--surface); padding: 0 14px 8px; display: flex; flex-direction: column; gap: 8px; }
.bhead .ftitle { padding-left: 2px; }
.bhead .switch { padding: 0 2px; }
/* 제목 없이 스위치만 있는 칸은 위쪽을 조금 띄운다. */
.fsec.plain { padding-top: 12px; }
.bhead .sort { display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 11px; padding: 3px; }
.bhead .sort button { height: 32px; font-size: 13px; border-radius: 8px; padding: 0 6px; }
.set { padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 9px; }
.set + .set { border-top: 1px solid var(--line); padding-top: 14px; }
.set h3 { margin: 4px 0 0; font-size: 12.5px; font-weight: 650; color: var(--ink-3); }
.set p { margin: 0; font-size: 12.5px; color: var(--ink-3); }
.set output { font-size: 17px; font-weight: 750; font-variant-numeric: tabular-nums; }
.set output small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 6px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; font-weight: 650; font-size: 15px; }
.switch input { appearance: none; width: 42px; height: 24px; border-radius: 999px; background: var(--line-2); position: relative; margin: 0; cursor: pointer; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: var(--sh-1); transition: transform .15s; }
.switch input:checked { background: var(--ok); }
.switch input:checked::after { transform: translateX(18px); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 13px; font-weight: 600; }
.opt:hover { border-color: var(--ink-3); }
.opt svg.i { width: 15px; height: 15px; vertical-align: -3px; margin-right: 5px; }
.opt[aria-pressed=true] svg.i { fill: currentColor; }

.rec .opts.four .vsep { flex: none; width: 1px; align-self: stretch; margin: 6px 2px; background: var(--line-2); }
.xgo[hidden] { display: none; }
.xdone, .xhint { font-size: 12.5px; color: var(--ink-3); }
.xdone:empty { display: none; }
.rec .opts.four .opt { font-size: 12px; padding: 0 3px; }
.rec .opts.four .opt .n { margin-left: 3px; }
.opt:disabled { opacity: .4; cursor: default; }
/* 메뉴의 레벨 칸과 보상 체계 */
.xlv { display: flex; flex-direction: column; gap: 4px; }
.xlv .top { display: flex; justify-content: space-between; align-items: baseline; }
.xlv .top b { font-size: 24px; font-weight: 800; }
.xlv .top span, .xlv p { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin: 0; }
.xnote { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-3); }
/* 메뉴의 레벨 칸(누르면 XP 기록) */
button.xlvbtn { width: 100%; display: flex; flex-direction: row; align-items: center; gap: 10px; text-align: left; padding: 4px 0; }
/* 메뉴의 레벨 밑 네 칸: 흰 카드 하나를 가는 선으로 나눈다. 보너스가 있는 두 칸에만 막대와 "4/5" */
.xstat .pr { display: flex; align-items: center; gap: 5px; width: calc(100% - 16px); margin-top: 3px; }
.xstat .pb { flex: 1; height: 4px; border-radius: 99px; background: color-mix(in srgb, var(--c) 18%, var(--surface)); overflow: hidden; }
.xstat .pb i { display: block; height: 100%; border-radius: 99px; background: var(--c); }
.xstat span.of { flex: none; font-size: 10.5px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.xstat .g.vote { --c: #f76707; }
.xstat .g.dong { --c: #0ca678; }
/* 네 칸 상자(메뉴의 레벨 밑, 랭킹에서 누른 사람 창): 흰 카드 하나를 가는 선으로 나눈다 */
.xstat { display: grid; grid-template-columns: repeat(4, 1fr); margin: 6px 0 8px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
.xstat button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 13px 2px 12px; background: none; border-radius: 0; }
.xstat button + button::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 1px; background: var(--line); }
.xstat button:active { background: var(--surface-2); }
.xstat b { font-size: 19px; font-weight: 800; letter-spacing: -.01em; color: var(--ink); font-variant-numeric: tabular-nums; }
.xstat b small { margin-left: 1px; font-size: 12px; font-weight: 650; color: var(--ink-2); }
.xstat span { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
button.xlvbtn .top { display: flex; justify-content: space-between; align-items: baseline; width: 100%; }
button.xlvbtn .xlvtxt { flex: 1; display: flex; flex-direction: column; gap: 4px; }
button.xlvbtn > svg.i { width: 16px; height: 16px; opacity: .45; flex: none; }
/* XP 기록 창 */
.xlsum { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--pri) 9%, var(--surface)); margin-top: 6px; }
.xlsum b { font-size: 22px; font-weight: 800; }
.xlsum span { font-size: 15px; font-weight: 700; color: var(--pri); }
.xll { display: flex; flex-direction: column; overflow-y: auto; max-height: 52vh; margin-top: 4px; }
.xli { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.xli > span { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.xli .rs { font-size: 14px; font-weight: 650; }
.xli small { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec .vh .vwho { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; text-decoration: underline; text-underline-offset: 2px; }
.xli.admin .rs { color: var(--pri); }
.xbox .xadm { margin-top: 8px; color: var(--ink-2); font-size: 13px; line-height: 1.5; }
.xbox .xexp { margin: 0 0 2px; color: var(--ink-2); font-size: 13.5px; line-height: 1.55; }
.xbox .xnone { padding: 14px 2px; color: var(--ink-3); font-size: 13.5px; }
button.xlink.xrow b { margin-right: 6px; }
.xli .rt { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.xli b { font-size: 14px; font-weight: 750; color: var(--pri); font-variant-numeric: tabular-nums; }
.xli.minus b { color: var(--ink-3); }
.xgrp { font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin-top: 8px; }
.xrow { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 3px 0; }
.xrow small { display: block; color: var(--ink-3); font-size: 12px; }
/* 보상 체계의 더 받는 경우: 받은 곳 수는 이름 바로 오른쪽 같은 줄에 */
/* 화살표가 있는 줄과 없는 줄의 XP 오른쪽 끝을 맞춘다(화살표 15px, 사이 16px) */
.xbox:has(> .xlink) > .xrow:not(.xlink) { padding-right: 31px; }
button.xlink.xrow > span small { display: inline-block; margin-left: 7px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 11.5px; font-weight: 650; vertical-align: 1px; }
.xrow b { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.xrow.got { color: var(--pri); }
.xrow.got b::before { content: "✓ "; }
/* 달성 보너스 표. 받은 칸은 보라로 채우고 체크, 다음 목표는 테두리와 번짐에 선물, 아직인 칸은 옅은 회색에 자물쇠. */
.xms { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 9px; margin: 6px 2px 4px; }
.xms span { display: flex; flex-direction: column; align-items: center; padding: 9px 2px 8px; border-radius: 14px; background: var(--surface-2); color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.xms span svg.i { width: 15px; height: 15px; margin-bottom: 4px; opacity: .45; }
.xms span b { font-size: 13.5px; font-weight: 750; color: var(--ink-2); line-height: 1.25; }
.xms span.got { background: var(--pri); color: rgba(255, 255, 255, .9); }
.xms span.got b { color: #fff; }
.xms span.got svg.i { opacity: 1; stroke-width: 3; }
.xms span.next { background: var(--surface); color: var(--pri); box-shadow: inset 0 0 0 1.5px var(--pri); }
/* 팝업마다 색을 다르게: 보상 체계는 보라, 방문 인증 보너스는 청록, 투표 보너스는 주황. 안쪽의 칸, 막대, 단추가 모두 이 색을 따른다. */
.xbox.visit, .xbox.dong { --pri: #0ca678; --pri2: #38d9a9; }
.xbox.vote { --pri: #f76707; --pri2: #ffa94d; }
.xbox { --pri2: #8b7bf2; }
.xbox { position: relative; overflow: hidden; }
/* 팝업은 색 띠 없이 흰 바탕. 아래 큰 단추는 팝업 색과 상관없이 앱 기본 보라. */
.xbox .btn.pri, .xbox .btn.pri:hover { background: #6a5ae0; color: #fff; }
.xbox .xhead { display: flex; align-items: center; gap: 10px; }
.xbadge { flex: none; width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: var(--pri); background: color-mix(in srgb, var(--pri) 13%, var(--surface)); }
.xbadge svg.i { width: 20px; height: 20px; }
/* 메뉴의 세 줄 앞에 붙는 같은 색 아이콘 */
button.xlink .xbadge { flex: none; width: 30px; height: 30px; border-radius: 9px; margin-right: 11px; }
button.xlink .xbadge svg.i { width: 16px; height: 16px; opacity: 1; }
button.xlink .xbadge.visit { --pri: #0ca678; --pri2: #38d9a9; }
button.xlink .xbadge.vote { --pri: #f76707; --pri2: #ffa94d; }
button.xlink .xbadge.rw { --pri: #6a5ae0; --pri2: #8b7bf2; }
button.xlink .xbadge.bug { --pri: #e03131; --pri2: #ff8787; }
button.xlink .xbadge.rank, .xbox.rank { --pri: #d6336c; --pri2: #f783ac; }
/* 닉네임 창: 색 띠와 색 칸 없이 차분하게 */
.xbox.nick { gap: 12px; padding: 22px 20px 18px; }
.xbox.nick h2 { font-size: 19px; }
.nkfield { display: flex; align-items: center; gap: 8px; height: 54px; padding: 0 7px 0 14px; border: 1.5px solid var(--line-2); border-radius: 14px; background: var(--surface); }
.nkfield:focus-within { border-color: var(--pri); }
.nkfield input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: var(--ink); font: inherit; font-size: 17px; font-weight: 650; }
.nkfield .nkre { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 38px; padding: 0 11px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; font-weight: 650; }
.nkfield .nkre svg.i { width: 15px; height: 15px; }
.nkfield .nkre:active { background: var(--line); }
.nknote { display: flex; gap: 7px; align-items: flex-start; margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
.xbox .nknote { color: var(--ink-2); }
.nknote svg.i { flex: none; width: 15px; height: 15px; margin-top: 2px; color: #e8590c; }
.xbox.nick .two { margin-top: 4px; }
.xbox.nick .btn { height: 48px; border-radius: 13px; font-size: 15px; }
.rkl .xli > span.rkname { flex-direction: row; align-items: center; gap: 8px; min-width: 0; }
.rkl .rkn { flex: none; min-width: 24px; text-align: center; color: var(--ink-2); }
.rkl .rkn.top { color: var(--pri); }
.rkl .rs { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rkl .rktag { flex: none; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--pri) 12%, var(--surface)); color: var(--pri); font-size: 11px; font-weight: 700; }
.rkl { overflow-x: hidden; }
.rkl .xli.rkme { padding-left: 8px; padding-right: 8px; border-radius: 12px; background: color-mix(in srgb, var(--pri) 9%, var(--surface)); }
.rkl button.xli { width: 100%; text-align: left; background: none; border-radius: 0; color: inherit; font: inherit; }
.rkl button.xli:active { background: var(--surface-2); }
.rkl button.xli.rkme { border-radius: 12px; background: color-mix(in srgb, var(--pri) 9%, var(--surface)); }
/* 랭킹에서 누른 사람 창 */
.xbox.person .pstop { display: flex; align-items: center; gap: 8px; min-width: 0; }
.xbox.person .pstop h2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xbox.person .psno { flex: none; font-size: 15px; font-weight: 800; color: #d6336c; }
.xbox.person .rktag { flex: none; padding: 1px 7px; border-radius: 999px; background: #fcebf1; color: #d6336c; font-size: 11px; font-weight: 700; }
.xbox.person .pslv { display: flex; align-items: baseline; justify-content: space-between; }
.xbox.person .pslv b { font-size: 26px; font-weight: 800; }
.xbox.person .pslv span { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.xstat.static > div { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 13px 2px 12px; }
.xstat.static > div + div::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 1px; background: var(--line); }
.xstat.static { margin: 0; }
.rkl .rkgap { text-align: center; color: var(--ink-3); padding: 4px 0; }
.xbox .xexp.warn { background: #fff4e6; color: #a8460b; }
.nkcur { margin: 4px 0 2px; font-size: 20px; font-weight: 800; }
.nkrow { display: flex; gap: 8px; margin-top: 6px; }
.nkrow input { flex: 1; min-width: 0; height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; }
.nkrow input:focus { outline: 2px solid var(--pri); outline-offset: -1px; border-color: transparent; }
.nkrow .btn { flex: none; }
button.xlink .xbadge.inbox, .xbox.fbl { --pri: #0b7285; --pri2: #66d9e8; }
button.xlink .xbadge.adm { --pri: #495057; --pri2: #adb5bd; }
/* 새 답변 빨간 점: 메뉴 단추 오른쪽 위, 내 문의 줄과 목록의 상태 옆 */
#menuBtn { position: relative; }
#menuBtn.dot::after { content: ""; position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: #fa5252; box-shadow: 0 0 0 2px var(--surface); }
.fbdot { display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: #fa5252; vertical-align: 2px; }
/* 내 문의, 받은 문의 목록과 한 건 보기 */
.xll .fbi { width: 100%; text-align: left; background: none; border-radius: 0; color: inherit; font: inherit; }
.xll .fbi .rs { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fbst { font-size: 12px; font-weight: 650; color: var(--ink-3); white-space: nowrap; }
.fbst.on { color: #0b7285; }
.fbst.todo { color: #e8590c; }
.fbd { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 58vh; margin-top: 4px; }
.fbd .fbq { white-space: pre-wrap; font-size: 14.5px; line-height: 1.6; }
.fbd .fbt { font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; }
.fbd .fba { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
.fbd .fba b { font-size: 12.5px; color: #0b7285; }
.fbd .fbwait { margin: 6px 0 0; font-size: 13.5px; color: var(--ink-2); }
.fbd .fbal { margin-top: 8px; font-size: 13px; }
.fbd textarea { min-height: 120px; }
/* 시험 모드 단추와 버튼 모음 */
#testbtn { position: fixed; left: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 86px); z-index: 70; display: inline-flex; align-items: center; gap: 5px; height: 38px; padding: 0 14px 0 11px; border-radius: 999px; background: #212529; color: #fff; font-size: 13px; font-weight: 700; box-shadow: var(--sh-1); }
#testbtn svg.i { width: 15px; height: 15px; }
.xbox.tmenu { gap: 8px; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tgrid button { min-height: 44px; padding: 6px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 650; line-height: 1.3; }
.tgrid button:active { background: var(--surface-2); }
button.xlink .xbadge.qna { --pri: #1c7ed6; --pri2: #74c0fc; }
/* 문의 창: 종류마다 색이 다르다. 앱 오류 빨강, 기능 제안 노랑, 기타 문의 파랑. */
.xbox.fb-bug, .fbk .fb-bug { --pri: #e03131; --pri2: #ff8787; }
.xbox.fb-idea, .fbk .fb-idea { --pri: #f2a900; --pri2: #ffd43b; }
.xbox.fb-etc, .fbk .fb-etc { --pri: #1c7ed6; --pri2: #74c0fc; }
.fbk { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 6px 0 4px; }
.fbk button { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; height: 62px; padding: 0 4px; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); font-size: 14px; font-weight: 650; }
.fbk button svg.i { width: 17px; height: 17px; color: var(--pri); flex: none; }
.fbk button[aria-pressed=true] { background: var(--surface); color: var(--pri); box-shadow: inset 0 0 0 1.5px var(--pri); }

.xbox textarea { width: 100%; min-height: 150px; resize: vertical; margin-top: 8px; padding: 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; line-height: 1.5; }
.xbox textarea:focus { outline: 2px solid var(--pri); outline-offset: -1px; border-color: transparent; }
.xms span.next b { color: var(--ink); }
.xms span.next svg.i { opacity: 1; }
/* 표 위: 지금 몇 곳인지, 다음 보너스가 얼마인지, 거기까지 얼마나 왔는지(칸 하나가 카페 한 곳). */
.xprog .of { display: inline; font-size: 15px; font-weight: 700; color: var(--ink-3); }
.xpbar { margin-top: -6px; padding: 4px 14px 14px; border-radius: 0 0 14px 14px; background: color-mix(in srgb, var(--pri) 9%, var(--surface)); }
.xpbar .tr { height: 10px; border-radius: 999px; background: color-mix(in srgb, var(--pri) 20%, var(--surface)); overflow: hidden; }
.xpbar i { display: block; height: 100%; border-radius: 999px; background: var(--pri); }
.xprog { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px; padding: 12px 14px 10px; border-radius: 14px 14px 0 0; background: color-mix(in srgb, var(--pri) 9%, var(--surface)); }
.xprog small { display: block; font-size: 11.5px; color: var(--ink-3); }
.xprog b { font-size: 22px; font-weight: 800; line-height: 1.2; }
.xprog .r { text-align: right; }
.xprog .r b { font-size: 16px; color: var(--pri); }
/* 달성 보너스: 메뉴에서는 다음 목표 한 줄만 보이고, 누르면 전체 표가 든 창이 위에 뜬다. */
button.xlink { width: 100%; align-items: center; text-align: left; padding: 7px 0; }
button.xlink span { flex: 1; }
button.xlink svg.i { width: 15px; height: 15px; opacity: .5; flex: none; }
#xinfo { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; padding: 18px; background: rgba(15, 20, 30, .5); }
/* 키보드가 떠 있을 때: 창을 위에 붙이고, 글 쓰는 칸을 줄여서 보내기 단추까지 키보드 위에 보이게 한다. */
#xinfo.kb { align-items: start; padding: 10px 14px; }
#xinfo.kb .xbox { max-height: 100%; }
#xinfo.kb .xbox > p { display: none; }
#xinfo.kb textarea { min-height: 90px; height: 90px; }
.xbox { width: min(360px, 100%); max-height: calc(100% - 20px); overflow-y: auto; background: var(--surface); border-radius: 18px; box-shadow: var(--sh-2); padding: 20px 18px 16px; display: flex; flex-direction: column; gap: 6px; }
.xbox h2 { margin: 0; font-size: 18px; font-weight: 800; }
.xbox p { margin: 0; font-size: 13px; color: var(--ink-3); }
.xbox .btn { margin-top: 12px; align-self: stretch; height: 44px; flex: none; }
.xbox .two .btn { align-self: auto; }
.xbox .xrow { align-items: center; }
#toast { width: max-content; position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%); z-index: 40; background: var(--inv); color: var(--on-inv); padding: 10px 16px; border-radius: 10px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--sh-2); }
.maplibregl-map { font-family: var(--font); }
.maplibregl-ctrl-attrib { background: color-mix(in srgb, var(--surface) 85%, transparent) !important; color: var(--ink-3); font-size: 11px; }
.maplibregl-ctrl-attrib a { color: var(--ink-3); }
/* 내 위치: 카페 점(파랑, 주황, 갈색)과 헷갈리지 않게 빨간 바탕에 사람 모양을 넣는다. */
.me { width: 28px; height: 28px; border-radius: 50%; background: #e5484d; border: 3px solid #fff; box-shadow: 0 0 0 7px rgba(229, 72, 77, .2), 0 2px 6px rgba(0, 0, 0, .3); display: grid; place-items: center; }
.me svg { width: 15px; height: 15px; fill: #fff; }

@media (max-width: 760px) {
  #bar { top: calc(10px + env(safe-area-inset-top, 0px)); left: 0; right: 0; flex-direction: column; gap: 0; }
  .srow { align-self: stretch; margin: 0 12px; }
  .search { width: auto; flex: 1; min-width: 0; height: 46px; }
  #menuBtn { width: 46px; height: 46px; }
  #chips { flex-wrap: nowrap; overflow-x: auto; align-self: stretch; gap: 6px; padding: 8px 12px 10px; scrollbar-width: none; }
  /* 칩 네 개(지역, 필터, 찜, 새로 연 카페)가 폰 한 줄에 들어오게 조금 좁힌다. */
  #chips .chip { padding: 0 11px; gap: 5px; }
  #chips::-webkit-scrollbar { display: none; }
  #panel { left: 0 !important; right: 0; top: auto !important; bottom: 0; width: auto !important; max-height: 62% !important; border-radius: 20px 20px 0 0; }
  #panel[data-kind=region], #panel[data-kind=filter], #panel[data-kind=search], #panel[data-kind=list] { max-height: 74% !important; }
  #panel[data-kind=detail][data-embed], #panel[data-kind=list] { max-height: 94% !important; }
  /* 목록 카드도 카페 카드처럼 전체 높이로 만들어 두고 아래로 밀어서 반만 보이게 한다. */
  #panel[data-kind=list] { height: 100%; }
  /* 폰의 카드는 모두 같은 방식이다: 윗줄에 손잡이 막대가 있고, 윗줄을 잡고 끌어내리면 닫힌다. X 단추는 두지 않는다. */
  .ph { position: relative; padding-top: 18px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .ph::before { content: ""; position: absolute; left: 50%; top: 6px; width: 38px; height: 4px; margin-left: -19px; border-radius: 2px; background: var(--line-2); }
  .ph .ib[aria-label="닫기"] { display: none; }
  /* 아래쪽 단추. 가운데에 "이 화면 N곳", 오른쪽 아래에 둥근 단추를 쌓는다(위에서부터 뒤로, 처음부터, 내 위치).
     내 위치가 늘 맨 아래에 있고, 지역 안으로 들어가면 그 위에 두 개가 더 생긴다. */
  #count { height: 44px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
  #ctrl { right: 12px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
  #ctrl .cgroup { display: none; }
  #ctrl .cbtn { width: 44px; height: 44px; border-radius: 50%; }
  #nav { display: contents; }
  #nav[hidden] { display: none; }
  .npair { position: absolute; z-index: 15; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); flex-direction: column; gap: 10px; }
  .npair .nbtn { width: 44px; height: 44px; padding: 0; justify-content: center; border-radius: 50%; }
  .npair .nbtn .t { display: none; }
  .npair .nbtn svg.i { width: 20px; height: 20px; }
  /* "OO구 전체 보기"는 개수 단추 바로 위 가운데. */
  #navAll { position: absolute; z-index: 15; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); height: 40px; border-radius: 999px; }
  /* 지도 출처(i)는 왼쪽 아래 구석. */
  .maplibregl-ctrl-bottom-left { left: 12px; bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
  .maplibregl-ctrl-bottom-left .maplibregl-ctrl-attrib { margin: 0; }
  .sheet-open #count, .sheet-open #ctrl, .sheet-open #nav, .sheet-open .maplibregl-ctrl-bottom-left { display: none; }
  #toast { bottom: auto; top: calc(122px + env(safe-area-inset-top, 0px)); }
  #toast.xp { top: auto; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
}

/* ===== 직접 그린 그림과 그림마다 다른 움직임 ===== */
.fx { position: relative; width: 100%; aspect-ratio: 1; }
.fx svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.fxd svg * { transform-box: fill-box; }
.fx .sp { opacity: 0; transform-origin: center; animation: fxSpark 1.3s var(--d, .8s) ease-in-out both; }
@keyframes fxSpark { 0% { transform: scale(0) rotate(0); opacity: 0; } 25% { transform: scale(1.15) rotate(30deg); opacity: 1; } 60% { transform: scale(.85) rotate(55deg); opacity: 1; } 100% { transform: scale(0) rotate(90deg); opacity: 0; } }
@keyframes fxPop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes fxBurst { 0% { transform: scale(.5); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1.25); opacity: 0; } }
@keyframes stHit { 30% { transform: scale(1.03, .94); } 100% { transform: scale(1); } }
@keyframes stMark { from { transform: scale(1.6) rotate(-12deg); opacity: 0; } to { transform: scale(1) rotate(-12deg); opacity: 1; } }

/* 반짝이를 남기는 안: 떴다가 작게 줄어 그 자리에서 천천히 깜빡인다 */
.fx.tw .sp { animation: fxSpark2 1.1s var(--d) ease-in-out both, fxTw 1.8s calc(var(--d) + 1.1s) ease-in-out infinite; }
@keyframes fxSpark2 { 0% { transform: scale(0) rotate(0); opacity: 0; } 30% { transform: scale(1.15) rotate(30deg); opacity: 1; } 100% { transform: scale(.72) rotate(90deg); opacity: 1; } }
@keyframes fxTw { 0%, 100% { transform: scale(.72) rotate(90deg); opacity: 1; } 50% { transform: scale(.42) rotate(90deg); opacity: .55; } }
/* 번개를 남기는 안 */
.fx .bo { transform-origin: center; animation: fxBo .45s var(--d) cubic-bezier(.2, .9, .3, 1.6) both; }
@keyframes fxBo { from { transform: scale(0) rotate(-25deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }

/* 1. 첫 도장: 내려와 쾅 찍고, 들려서 카드 위에 비스듬히 남는다 */
.fx-stamp .card { transform-origin: center bottom; animation: fxPop .35s cubic-bezier(.2, .9, .3, 1.3) both, stHit .3s .66s ease-out; }
.fx-stamp .tool { transform-origin: center bottom; animation: stTool 1.3s .2s cubic-bezier(.4, 0, .2, 1) both; }
@keyframes stTool {
  0% { transform: translate(0, -14px) rotate(-16deg); opacity: 0; }
  25% { transform: translate(0, -2px) rotate(-4deg); opacity: 1; }
  32% { transform: translate(0, -4px) rotate(0); animation-timing-function: cubic-bezier(.6, 0, 1, .6); }
  39% { transform: translate(0, 8.4px) scale(1.04, .86); }
  52% { transform: translate(0, 8px) scale(1); }
  78% { transform: translate(2.6px, -1.4px) rotate(11deg); }
  100% { transform: translate(2.6px, 0) rotate(11deg); opacity: 1; }
}
.fx-stamp .mark { transform-origin: center; animation: stMark .4s .68s cubic-bezier(.2, .9, .3, 1.6) both; }
.fx-stamp .burst line, .fx-stampfull .burst line { stroke: #FFB02E; stroke-width: .8; stroke-linecap: round; }
.fx-stamp .burst { transform-origin: center; animation: fxBurst .45s .68s ease-out both; }

/* 2. 쿠폰판 완성: 다섯 칸이 착착 차는 동안 도장이 위에서 기다리다가, 마지막 칸을 쾅 */
.fx-stampfull .card { transform-origin: center bottom; animation: fxPop .3s cubic-bezier(.2, .9, .3, 1.3) both, stHit .32s 1.05s ease-out; }
.fx-stampfull .m { transform-origin: center; animation: sfMark .26s var(--d) cubic-bezier(.2, .9, .3, 1.6) both; }
@keyframes sfMark { from { transform: scale(1.8) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(-10deg); opacity: 1; } }
.fx-stampfull .m6 { transform-origin: center; animation: stMark .4s 1.07s cubic-bezier(.2, .9, .3, 1.6) both; }
.fx-stampfull .burst { transform-origin: center; animation: fxBurst .45s 1.07s ease-out both; }
.fx-stampfull .burst line { stroke-width: .7; }
.fx-stampfull .tool { transform-origin: center bottom; animation: sfTool 1.5s .1s cubic-bezier(.4, 0, .2, 1) both; }
@keyframes sfTool {
  0% { transform: translate(0, -10px) rotate(-16deg); opacity: 0; }
  17% { transform: translate(0, -1px) rotate(-6deg); opacity: 1; }
  50% { transform: translate(0, 0) rotate(-3deg); }
  57% { transform: translate(0, -3px) rotate(0); animation-timing-function: cubic-bezier(.6, 0, 1, .6); }
  64% { transform: translate(0, 15.6px) scale(1.04, .86); }
  72% { transform: translate(0, 15.6px) scale(1); }
  88% { transform: translate(1.8px, -.8px) rotate(10deg); }
  100% { transform: translate(1.8px, 0) rotate(10deg); opacity: 1; }
}

/* 3, 4. 동네 지도: 지도가 뜨고, 핀이 꽂히는 칸이 칠해진다 */
.fx-town .map, .fx-towns .map { transform-origin: center; animation: fxPop .35s cubic-bezier(.2, .9, .3, 1.3) both; }
.fx-town .icons, .fx-towns .icons { transform-origin: center; animation: fxPop .35s .12s cubic-bezier(.2, .9, .3, 1.3) both; }
.fx-town .fill, .fx-towns .fill { transform-origin: center; opacity: 0; animation: twFill .4s var(--d) cubic-bezier(.2, .9, .3, 1.4) both; }
@keyframes twFill { from { transform: scale(.2); opacity: 0; } 60% { opacity: .95; } to { transform: scale(1); opacity: .92; } }
.fx-town .pin { transform-origin: center bottom; animation: twPin .62s .05s cubic-bezier(.55, 0, .9, .45) both, twLand .35s .62s ease-out; }
@keyframes twPin { from { transform: translateY(-20px); opacity: 0; } 25% { opacity: 1; } to { transform: translateY(0); opacity: 1; } }
@keyframes twPin2 { from { transform: translateY(-12px); opacity: 0; } 25% { opacity: 1; } to { transform: translateY(0); opacity: 1; } }
@keyframes twLand { 30% { transform: scale(1.15, .8); } 65% { transform: scale(.95, 1.06); } 100% { transform: scale(1); } }
.fx-town .psh { transform-origin: center; animation: twSh .62s .05s ease-in both; }
@keyframes twSh { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
/* 동네 보너스: 핀 셋이 차례로, 그 사이를 점선 길이 잇는다 */
.fx-towns .map { animation: fxPop .35s cubic-bezier(.2, .9, .3, 1.3) both, sfJump .4s 1.5s ease-out; }
@keyframes sfJump { 35% { transform: translateY(-1.6px) scale(1.02, .97); } 100% { transform: none; } }
.fx-towns .pin { transform-origin: center bottom; animation: twPin2 .42s var(--d) cubic-bezier(.55, 0, .9, .45) both, twLand .35s var(--e) ease-out; }
.fx-towns .psh { transform-origin: center; animation: twSh .42s var(--d) ease-in both; }
.fx-towns .ft { opacity: 0; transform-origin: center; animation: twFt .22s var(--d) ease-out both; }
@keyframes twFt { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.fx-towns .pt { transform-origin: center; opacity: 0; animation: twPt .4s var(--d) cubic-bezier(.2, .9, .3, 1.5) both; }
@keyframes twPt { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: .95; } }

/* 5. 개업 리본 커팅 */
.fx-shop .shop { transform-origin: center bottom; animation: shUp .4s cubic-bezier(.2, .9, .3, 1.3) both; }
@keyframes shUp { from { transform: scaleY(.2); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
.fx-shop .rl, .fx-shop .rr, .fx-shop .bow { animation: fxPop .3s .2s both; transform-origin: center; }
.fx-shop .rl { transform-origin: left center; animation: fxPop .3s .2s both, shFallL .45s .78s cubic-bezier(.5, 0, .7, 1) forwards; }
.fx-shop .rr { transform-origin: right center; animation: fxPop .3s .2s both, shFallR .45s .78s cubic-bezier(.5, 0, .7, 1) forwards; }
@keyframes shFallL { to { transform: rotate(62deg); } }
@keyframes shFallR { to { transform: rotate(-62deg); } }
.fx-shop .bow { animation: fxPop .3s .2s both, shBow .5s .78s ease-in forwards; }
@keyframes shBow { to { transform: translateY(6px) rotate(40deg); opacity: 0; } }
.fx-shop .snip line { stroke: #F8312F; stroke-width: .7; stroke-linecap: round; }
.fx-shop .snip { transform-origin: center; animation: fxBurst .4s .78s ease-out both; }
.fx-shop .sc { animation: shSc 1.25s .3s cubic-bezier(.3, .7, .3, 1) both; }
@keyframes shSc { 0% { transform: translate(10px, -7px) rotate(-20deg); opacity: 0; } 28% { transform: translate(0, 0) rotate(0); opacity: 1; } 62% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(9px, -9px) rotate(18deg); opacity: 0; } }
.fx-shop .bu { transform-origin: 8.2px 4px; animation: shBu .25s .58s ease-in both; }
.fx-shop .bl { transform-origin: 8.2px .9px; animation: shBl .25s .58s ease-in both; }
@keyframes shBu { from { transform: rotate(-18deg); } to { transform: rotate(2deg); } }
@keyframes shBl { from { transform: rotate(18deg); } to { transform: rotate(-2deg); } }

/* 6. 플러그 꽂기 */
.fx-plug .wall, .fx-plug .sock { transform-origin: center; animation: fxPop .3s cubic-bezier(.2, .9, .3, 1.3) both; }
.fx-plug .bat { transform-origin: center; animation: fxPop .3s .1s cubic-bezier(.2, .9, .3, 1.3) both; }
.fx-plug .plug { animation: plIn .45s .2s cubic-bezier(.55, 0, .8, .5) both, plBump .25s .65s ease-out; }
@keyframes plIn { from { transform: translateX(10px); opacity: 0; } 30% { opacity: 1; } to { transform: translateX(0); opacity: 1; } }
@keyframes plBump { 40% { transform: translateX(-.7px); } 100% { transform: none; } }
.fx-plug .zz { transform-origin: center; animation: plZap .9s .66s steps(1) both; }
@keyframes plZap { 0% { transform: scale(0); opacity: 0; } 10% { transform: scale(1.2); opacity: 1; } 25% { opacity: .2; } 40% { opacity: 1; transform: scale(1); } 55% { opacity: .3; } 70% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
.fx-plug .bf { transform-origin: left center; animation: plFill .6s .75s cubic-bezier(.3, .7, .3, 1) both; }
@keyframes plFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* 7. 달력 */
.fx-cal .body { transform-origin: center bottom; animation: fxPop .35s cubic-bezier(.2, .9, .3, 1.3) both; }
.fx-cal .pg { transform-origin: center top; animation: clFlip .22s var(--d) ease-in both; }
@keyframes clFlip { from { transform: scaleY(1); opacity: 1; } 90% { opacity: 1; } to { transform: scaleY(0) skewX(8deg); opacity: 0; } }
.fx-cal .ok path { stroke-dasharray: 14; stroke-dashoffset: 14; animation: fxDraw .3s 1.05s ease-out forwards; }
@keyframes fxDraw { to { stroke-dashoffset: 0; } }

html, body { height: auto; overflow: visible; }
body { margin: 0; min-height: 100vh; background: #f4f3f0; overflow-y: auto; }
.tw { max-width: 520px; margin: 0 auto; padding: 18px 14px 70px; }
.tw h1 { font-size: 20px; margin: 4px 2px 6px; }
.tw > p { margin: 0 2px 4px; font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }
.tw h2 { margin: 22px 2px 4px; font-size: 16px; }
.tw h2 + p { margin: 0 2px 10px; font-size: 12.5px; color: var(--ink-3); }
/* 가운데 축하 화면: 칸 */
.cg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cg button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
.cg .art { width: 62%; }
.cg b { font-size: 13px; line-height: 1.35; text-align: center; }
/* 화면 아래 XP 알림: 앱의 보라색 알림과 같은 모양. 그림은 왼쪽 위로 살짝 튀어나온다 */
.bl { display: flex; flex-direction: column; gap: 6px; }
.bl .nm { font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin: 12px 2px 0; }
.xpb { position: relative; display: inline-flex; align-items: baseline; gap: 10px; align-self: flex-start; margin: 22px 0 0 4px; padding: 11px 20px 11px 68px; border-radius: 999px; background: #6a5ae0; color: #fff; box-shadow: 0 6px 16px rgba(106, 90, 224, .28); cursor: pointer; }
.xpb b { font-size: 16px; font-weight: 800; white-space: nowrap; }
.xpb span { font-size: 13px; font-weight: 600; opacity: .92; white-space: nowrap; }
.xpb .ti { position: absolute; left: 6px; bottom: 3px; width: 56px; height: 56px; }
.xpb .ti .fx { width: 100%; }
/* 확인 창 */
.dl { display: grid; grid-template-columns: 1fr; gap: 12px; }
.mini { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 18px 14px; border-radius: 20px; background: var(--surface); box-shadow: var(--sh-2); cursor: pointer; }
.mini .ti { width: 92px; }
.mini h3 { margin: 0; font-size: 18px; }
.mini p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.mini .ok { align-self: stretch; height: 46px; border-radius: 13px; background: #6a5ae0; color: #fff; display: grid; place-items: center; font-weight: 700; margin-top: 4px; }
.tag { display: inline-block; margin: 0 2px 6px; font-size: 12px; font-weight: 700; color: var(--ink-3); }
/* 레벨 밑 숫자 칸 모형: 메뉴 패널처럼 흰 바탕 */
.ul { display: flex; flex-direction: column; gap: 14px; }
.uc .tag { margin-bottom: 2px; }
.uc .ud { margin: 0 2px 8px; font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
.pnl { background: var(--surface); border-radius: 18px; box-shadow: var(--sh-1); overflow: hidden; }
.pnl .fsec { border-bottom: 0; }
.pnl .xend { display: none; }

</style>

var uid = 0;
function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
function art(k) { var w = el('div', 'fx fxd ' + D.cls[k]); uid++; w.innerHTML = D.art[k].replace(/__ID__/g, String(uid)); return w; }
// 자리마다 그림을 다시 넣어 처음부터 움직이게 한다.
var slots = [];
function slot(box, k) { var s = { box: box, k: k, go: function () { box.textContent = ''; box.appendChild(art(k)); } }; s.go(); slots.push(s); return s; }
// 1. 가운데 축하 화면
D.celeb.forEach(function (c) {
  var b = el('button'), a = el('div', 'art'); b.type = 'button'; b.appendChild(a); b.appendChild(el('b', null, c[0]));
  var s = slot(a, c[1]); b.onclick = function () { s.go(); celeb(c); }; document.getElementById('cg').appendChild(b);
});

D.bubble.forEach(function (c) {

  var s = slot(ti, c[1]); p.onclick = function () { s.go(); }; wrap.appendChild(p);
});

  var m = el('div', 'mini'), ti = el('div', 'ti'); m.appendChild(ti); m.appendChild(el('h3', null, c[2])); m.appendChild(el('p', null, c[3])); m.appendChild(el('div', 'ok', '확인'));
  var s = slot(ti, c[1]); m.onclick = function () { s.go(); }; wrap.appendChild(m);
});

D.ui.forEach(function (c) {
  var u = el('div', 'uc'), pn = el('div', 'pnl'), fs = el('div', 'fsec');
  u.appendChild(el('div', 'tag', c[0])); u.appendChild(el('p', 'ud', c[1]));
  fs.innerHTML = c[2]; pn.appendChild(fs); u.appendChild(pn); document.getElementById('ul').appendChild(u);
});
// 화면에 보이는 그림은 5초마다 다시 움직인다. 축하 화면이 떠 있으면 멈춘다.
setInterval(function () {
  if (document.getElementById('celeb')) return;
  slots.forEach(function (s) { var r = s.box.getBoundingClientRect(); if (r.bottom > 0 && r.top < innerHeight) s.go(); });
}, 5000);
// 앱과 같은 모양의 가운데 축하 화면
function celeb(c) {
  var old = document.getElementById('celeb'); if (old) old.remove();
  var o = el('div'), conf = el('div', 'cf'), card = el('div', 'cc'), medal = el('div', 'md lt');
  o.id = 'celeb'; o.className = c[2];
  medal.appendChild(art(c[1])); card.appendChild(medal);
  card.appendChild(el('div', 'ct', c[3])); card.appendChild(el('div', 'cn', c[4])); card.appendChild(el('div', 'cx', c[5]));
  var ok = el('button', 'btn pri', '확인'); ok.type = 'button'; ok.onclick = function () { o.classList.add('out'); setTimeout(function () { o.remove(); }, 220); }; card.appendChild(ok);
  o.appendChild(conf); o.appendChild(card); document.body.appendChild(o);

}
