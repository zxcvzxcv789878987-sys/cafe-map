<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>그림 모음</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 그림 모음(시험용, 2026-11-26 새로 만듦).
   앱(index.html)의 그림 자료(FX)와 움직임 모양을 열 때마다 그대로 읽어 와 보여 준다. 앱 그림이 바뀌면 여기도 저절로 따라간다.
   앱의 모양 규칙은 그림 칸 안(섀도 루트)에만 넣어서 이 페이지의 바깥 모양과 섞이지 않게 한다. */
:root {
  --bg: #f1f3f6; --surface: #ffffff; --surface-2: #f3f5f8;
  --ink: #14171c; --ink-2: #4b5462; --ink-3: #8b93a1; --line: #e7eaee;
  --pri: #6a5ae0;
  --font: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
body.dark { --bg: #15171c; --surface: #22252d; --surface-2: #2b2f38; --ink: #eef0f4; --ink-2: #b9bfca; --ink-3: #8a93a3; --line: #343944; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; font-family: var(--font); font-size: 14px; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; transition: background .2s; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* 위쪽 고정 줄: 돌아가기, 제목, 찾기, 묶음 칩, 크기와 바탕 */
.bar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px); box-shadow: 0 1px 0 var(--line); }
.in { max-width: 1040px; margin: 0 auto; padding: 12px 16px 12px; padding-top: max(12px, env(safe-area-inset-top)); }
.top { display: flex; align-items: center; gap: 10px; }
.back { display: inline-flex; align-items: center; gap: 2px; height: 36px; padding: 0 12px 0 7px; border-radius: 11px; background: var(--surface); box-shadow: 0 1px 2px rgba(20, 23, 28, .08); color: var(--ink); font-size: 13.5px; font-weight: 700; text-decoration: none; }
.back:active { transform: scale(.97); }
h1 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
.count { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.search { display: flex; align-items: center; gap: 8px; height: 42px; margin-top: 12px; padding: 0 5px 0 12px; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-3); cursor: text; }
.search:focus-within { box-shadow: inset 0 0 0 1.5px var(--pri); }
.search input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: none; font-size: 15px; color: var(--ink); }
.search input::placeholder { color: var(--ink-3); }
.search input::-webkit-search-cancel-button { display: none; }
.clr { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; color: var(--ink-3); }
.clr:active { background: var(--surface-2); }
.chips { display: flex; gap: 6px; margin: 10px -16px 0; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); font-size: 13px; font-weight: 700; white-space: nowrap; transition: background .15s, color .15s; }
.chip small { font-size: 12px; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chip.on { background: var(--pri); color: #fff; box-shadow: none; }
.chip.on small { color: rgba(255, 255, 255, .78); }
.opts { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.seg button { height: 30px; padding: 0 11px; border-radius: 8px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); white-space: nowrap; transition: background .15s, color .15s; }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--bg); }
.play { display: inline-flex; align-items: center; gap: 6px; height: 36px; margin-left: auto; padding: 0 12px 0 10px; border-radius: 11px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); font-size: 13px; font-weight: 700; white-space: nowrap; }
.play:active { transform: scale(.97); }
main { max-width: 1040px; margin: 0 auto; padding: 0 16px calc(48px + env(safe-area-inset-bottom)); }
.state { padding: 72px 0; text-align: center; font-size: 14px; color: var(--ink-2); }
@media (max-width: 420px) {
  .play span { display: none; }
  .play { padding: 0 10px; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-replay" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v3.8h3.8"/></symbol>
</svg>
<div class="bar"><div class="in">
  <div class="top">
    <a class="back" href="../?test"><svg class="i"><use href="#i-back"/></svg>시험 모드</a>
    <h1>그림 모음</h1>
    <span class="count" id="count"></span>
  </div>
  <label class="search">
    <svg class="i"><use href="#i-search"/></svg>
    <input id="q" type="search" placeholder="이름으로 찾기" autocomplete="off" aria-label="그림 이름으로 찾기">
    <button class="clr" id="clr" type="button" aria-label="찾는 글 지우기" hidden><svg class="i"><use href="#i-x"/></svg></button>
  </label>
  <div class="chips" id="chips" role="group" aria-label="묶음"></div>
  <div class="opts">
    <div class="seg" id="size" role="group" aria-label="크기"></div>
    <div class="seg" id="bg" role="group" aria-label="바탕"></div>
    <button class="play" id="play" type="button" aria-label="보이는 그림 다시 움직이기"><svg class="i"><use href="#i-replay"/></svg><span>다시 움직이기</span></button>
  </div>
</div></div>
<main>
  <div id="gal"></div>
  <p class="state" id="state">그림을 불러오는 중이에요</p>
</main>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'cafemap.fxgallery';
  // 크기: [그림 너비, 칸 최소 너비]
  var SIZES = [['s', '작게', 64, 104], ['m', '보통', 96, 136], ['l', '크게', 148, 188]];
  var BGS = [['light', '흰 바탕'], ['dark', '어두운 바탕']];
  var CATS = [['all', '전체'], ['tier', '레벨 단계'], ['egg', '이스터 에그'], ['menu', '메뉴 아이콘'], ['etc', '알림과 보상']];
  // 앱 코드에서 쓰이는 곳을 보고 붙인 이름(레벨 단계와 이스터 에그는 앱의 TIERS, EGGS에서 읽는다)
  var NAMES = {
    egg: '도감의 닫힌 알', egghard: '어려운 에그의 닫힌 알', eggcrack: '찾았을 때 금 가는 알', eggopen: '원두로 열 때 깨지는 알',
    stamp: '축하 도장', stampfull: '콘센트 보너스 달성', towns: '새 동네 보너스 달성', brands3: '브랜드 보너스 달성',
    shops3: '새로 연 카페 보너스 달성', cal3: '오랜만의 기록 보너스 달성', chest: '히든 보너스 열림', lvstairs: '레벨 업',
    login: '로그인', cup: '닉네임', plane: '보냈어요(문의, 폐업 신고)', latte: '찜 알림', char: '우리 캐릭터',
    plug: '원두 알림: 콘센트 기록', town: '원두 알림: 새 동네', shop: '원두 알림: 새로 연 카페', cal: '원두 알림: 오랜만의 기록', brand: '원두 알림: 새 브랜드',
    mi_rule: '원두 모으는 법', mi_gift: '보상', mi_rank: '전체 랭킹', mi_ask: '문의하기', mi_mine: '내 문의', mi_inbox: '받은 문의',
    mi_test: '시험 모드', mi_log: '원두 기록', mi_bug: '문의: 오류', mi_idea: '문의: 아이디어', mi_etc: '문의: 그 밖',
    mi_clock: '닉네임 잠김 시계', mi_pin: '지역 칩', mi_heart: '찜 단추', mi_flag: '폐업 신고', mi_route: '길찾기',
    mi_plug: '콘센트 좌석 표시', mi_dice: '다른 닉네임 뽑기', mi_dex: '브랜드 도감', mi_map: '새 동네 지도'
  };
  var st = { cat: 'all', size: 'm', bg: 'light', q: '' };
  try { var sv = JSON.parse(localStorage.getItem(KEY) || 'null'); if (sv) ['cat', 'size', 'bg'].forEach(function (k) { if (sv[k]) st[k] = sv[k]; }); } catch (e) { /* 저장이 막혀도 기본값으로 연다 */ }
  var save = function () { try { localStorage.setItem(KEY, JSON.stringify({ cat: st.cat, size: st.size, bg: st.bg })); } catch (e) { /* 넘어간다 */ } };
  var norm = function (t) { return String(t).replace(/\s+/g, '').toLowerCase(); };

  var host = $('gal'), root = host.attachShadow({ mode: 'open' }), FX = null, seq = 0, items = [], secs = {};
  var seen = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { seen.unobserve(e.target); play(e.target); } });
  }, { rootMargin: '60px' }) : null;

  // 앱의 fxArt와 같은 방식: 칸 이름을 붙이고 __ID__를 그림마다 다른 번호로 바꾼다
  function art(k) {
    var w = document.createElement('div');
    w.className = 'fx fxd ' + (FX.cls[k] || '');
    w.innerHTML = FX.art[k].replace(/__ID__/g, 'g' + (++seq));
    return w;
  }
  function play(card) {
    var a = card.querySelector('.g-art');
    a.textContent = ''; a.appendChild(art(card.dataset.k));
  }

  fetch('../index.html', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.text(); })
    .then(build)
    .catch(function () { $('state').textContent = '그림을 불러오지 못했어요. 새로고침해 주세요.'; });

  function build(html) {
    var i = html.indexOf('  var FX = '), j = html.indexOf('\n', i);
    if (i < 0) throw new Error('no FX');
    FX = JSON.parse(html.slice(i + 11, j).trim().replace(/;\s*$/, ''));
    var css = (html.match(/<style>([\s\S]*?)<\/style>/) || ['', ''])[1];

    // 레벨 단계 이름(TIERS)과 이스터 에그 이름, 짝(EGGS)을 앱 코드에서 읽는다
    var tiers = {}, m, n = 0;
    var tl = (html.match(/var TIERS = (\[[^\n]*?\]);/) || ['', ''])[1], re = /\[(\d+),\s*(?:'([^']*)'|"([^"]*)")\]/g;
    while ((m = re.exec(tl))) { n++; tiers['tier' + n] = { lv: +m[1], name: m[2] || m[3] }; }
    var eggs = [], es = html.indexOf('var EGGS = ['), eb = es >= 0 ? html.slice(es, html.indexOf('\n  ];', es)) : '';
    var re2 = /\['(\w+)', '([^']*)', '[^']*'(?:, '(\w+)')?\]/g;
    while ((m = re2.exec(eb))) eggs.push({ id: m[1], name: m[2], pair: m[3] || '' });

    // 묶음과 차례
    var keys = Object.keys(FX.art), used = {};
    var add = function (k, cat, name, tag, hard) { if (!FX.art[k] || used[k]) return; used[k] = 1; items.push({ k: k, cat: cat, name: name, tag: tag || '', hard: !!hard }); };
    keys.filter(function (k) { return /^tier\d+$/.test(k); })
      .sort(function (a, b) { return +a.slice(4) - +b.slice(4); })
      .forEach(function (k) { var t = tiers[k]; add(k, 'tier', t ? t.name : k, t ? 'Lv.' + t.lv : ''); });
    ['egg', 'egghard', 'eggcrack', 'eggopen'].forEach(function (k) { add(k, 'egg', NAMES[k] || k); });
    // 도감처럼 일반 에그 다음에 그 어려운 짝
    eggs.filter(function (e) { return !e.pair; }).forEach(function (e) {
      add('egg_' + e.id, 'egg', e.name, '일반');
      eggs.forEach(function (h) { if (h.pair === e.id) add('egg_' + h.id, 'egg', h.name, '어려움', true); });
    });
    keys.forEach(function (k) { if (/^egg/.test(k)) add(k, 'egg', NAMES[k] || k); });
    keys.forEach(function (k) { if (/^mi_/.test(k)) add(k, 'menu', NAMES[k] || k); });
    keys.forEach(function (k) { add(k, 'etc', NAMES[k] || k); });

    // 그림 칸 안에만 앱 모양 규칙을 넣는다(:root는 :host로)
    var style = document.createElement('style');
    style.textContent = css.replace(/:root\b/g, ':host') + '\n' + [
      ':host { display: block; font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; --aw: 96px; --cw: 136px; --card: #fff; --cink: #14171c; --cmut: #8b93a1; }',
      ':host(.dark) { --card: #22252d; --cink: #eef0f4; --cmut: #8a93a3; }',
      '.g-sec { padding-top: 20px; }',
      '.g-sec[hidden], .g-card[hidden] { display: none !important; }',
      '.g-h { display: flex; align-items: baseline; gap: 7px; margin: 0 2px 10px; font-size: 15px; font-weight: 800; color: var(--cink); }',
      '.g-h small { font-size: 12.5px; font-weight: 700; color: var(--cmut); font-variant-numeric: tabular-nums; }',
      '.g-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cw), 1fr)); gap: 10px; }',
      '.g-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px 11px; border-radius: 16px; background: var(--card); box-shadow: 0 1px 2px rgba(20, 23, 28, .06); text-align: center; cursor: pointer; transition: transform .12s, background .2s; -webkit-tap-highlight-color: transparent; }',
      ':host(.dark) .g-card { box-shadow: none; }',
      '.g-card:active { transform: scale(.97); }',
      '.g-card:focus-visible { outline: 2px solid #6a5ae0; outline-offset: 2px; }',
      '.g-art { width: var(--aw); height: var(--aw); display: grid; place-items: center; }',
      '.g-art > .fx { width: 100%; }',
      '.g-name { font-size: 13px; font-weight: 700; line-height: 1.35; color: var(--cink); word-break: keep-all; }',
      '.g-key { font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--cmut); }',
      '.g-tag { position: absolute; top: 8px; left: 8px; padding: 1px 7px; border-radius: 999px; background: #f0eefc; color: #5b4bd6; font-size: 11px; font-weight: 700; }',
      '.g-tag.hard { background: #6a5ae0; color: #fff; }',
      ':host(.dark) .g-tag:not(.hard) { background: #34314d; color: #c9c2ff; }'
    ].join('\n');
    root.appendChild(style);

    var labels = {}; CATS.forEach(function (c) { labels[c[0]] = c[1]; });
    CATS.slice(1).forEach(function (c) {
      var sec = document.createElement('div'), h = document.createElement('div'), grid = document.createElement('div'), cnt = document.createElement('small');
      sec.className = 'g-sec'; h.className = 'g-h'; grid.className = 'g-grid';
      h.appendChild(document.createTextNode(c[1])); h.appendChild(cnt); sec.appendChild(h); sec.appendChild(grid);
      root.appendChild(sec); secs[c[0]] = { sec: sec, grid: grid, cnt: cnt };
    });
    items.forEach(function (it) {
      var c = document.createElement('div'), a = document.createElement('div'), nm = document.createElement('div'), ky = document.createElement('div');
      c.className = 'g-card'; c.dataset.k = it.k; c.tabIndex = 0; c.setAttribute('role', 'button');
      c.setAttribute('aria-label', it.name + ', 눌러서 다시 움직이기');
      a.className = 'g-art'; nm.className = 'g-name'; nm.textContent = it.name; ky.className = 'g-key'; ky.textContent = it.k;
      c.appendChild(a); c.appendChild(nm); c.appendChild(ky);
      if (it.tag) { var tg = document.createElement('span'); tg.className = 'g-tag' + (it.hard ? ' hard' : ''); tg.textContent = it.tag; c.appendChild(tg); }
      c.addEventListener('click', function () { play(c); });
      c.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(c); } });
      secs[it.cat].grid.appendChild(c);
      it.el = c; it.q = norm(it.name + it.k + (it.tag || '') + labels[it.cat]);
      if (seen) seen.observe(c); else play(c);
    });
    $('state').hidden = true;
    controls();
    apply();
  }

  // 위쪽 고정 줄의 단추들
  function controls() {
    var chips = $('chips');
    CATS.forEach(function (c) {
      var b = document.createElement('button'), n = c[0] === 'all' ? items.length : items.filter(function (it) { return it.cat === c[0]; }).length, sm = document.createElement('small');
      b.type = 'button'; b.className = 'chip'; b.dataset.c = c[0];
      b.appendChild(document.createTextNode(c[1])); sm.textContent = String(n); b.appendChild(sm);
      b.addEventListener('click', function () { st.cat = c[0]; save(); apply(); window.scrollTo({ top: 0 }); });
      chips.appendChild(b);
    });
    var seg = function (box, list, key) {
      list.forEach(function (o) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = o[1]; b.dataset.v = o[0];
        b.addEventListener('click', function () { st[key] = o[0]; save(); apply(); });
        box.appendChild(b);
      });
    };
    seg($('size'), SIZES, 'size'); seg($('bg'), BGS, 'bg');
    var q = $('q'), clr = $('clr');
    q.addEventListener('input', function () { st.q = q.value; clr.hidden = !q.value; apply(); });
    clr.addEventListener('click', function () { q.value = ''; st.q = ''; clr.hidden = true; apply(); q.focus(); });
    $('play').addEventListener('click', function () {
      items.forEach(function (it) {
        if (it.el.hidden) return;
        var r = it.el.getBoundingClientRect();
        if (r.bottom > -40 && r.top < window.innerHeight + 40) play(it.el);
      });
    });
  }

  // 묶음, 찾기, 크기, 바탕을 화면에 맞춘다
  function apply() {
    var v = norm(st.q), shown = 0, per = {};
    items.forEach(function (it) {
      var on = (st.cat === 'all' || it.cat === st.cat) && (!v || it.q.indexOf(v) >= 0);
      it.el.hidden = !on; if (on) { shown++; per[it.cat] = (per[it.cat] || 0) + 1; }
    });
    Object.keys(secs).forEach(function (c) { var s = secs[c]; s.sec.hidden = !per[c]; s.cnt.textContent = String(per[c] || 0); });
    $('state').hidden = shown > 0; if (!shown) $('state').textContent = '찾는 그림이 없어요';
    $('count').textContent = shown === items.length ? '그림 ' + items.length + '개' : shown + ' / ' + items.length;
    document.querySelectorAll('#chips .chip').forEach(function (b) { b.classList.toggle('on', b.dataset.c === st.cat); });
    var sz = SIZES.filter(function (s) { return s[0] === st.size; })[0] || SIZES[1];
    host.style.setProperty('--aw', sz[2] + 'px'); host.style.setProperty('--cw', sz[3] + 'px');
    document.querySelectorAll('#size button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === sz[0])); });
    var dark = st.bg === 'dark';
    document.body.classList.toggle('dark', dark); host.classList.toggle('dark', dark);
    document.querySelectorAll('#bg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === st.bg)); });
  }
})();
</script>
