<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>카페 지도</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- 검색 사이트에 잡히지 않게 한다. 주소를 아는 사람만 연다. -->
<meta name="robots" content="noindex, nofollow">
<!-- 휴대폰 홈 화면에 추가하면 앱처럼 꽉 찬 화면으로 열린다. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="카페 지도">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 배치: 화면 전체가 지도. 위에 검색창과 필터 칩 한 줄만 떠 있다.
   그 밖의 것(지역 고르기, 브랜드 고르기, 목록, 카페 정보)은 필요할 때만 뜨는 카드 하나에 번갈아 나온다.
   PC에서는 카드가 왼쪽 위에, 휴대폰에서는 아래에서 올라온다. */
:root {
  --bg: #f1f3f6;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --ink: #14171c;
  --ink-2: #4b5462;
  --ink-3: #8b93a1;
  --line: #e7eaee;
  --line-2: #d3d8df;
  --inv: #14171c;
  --on-inv: #ffffff;
  --c-low: #f59f0a;
  --c-fr: #2463eb;
  --c-ind: #8a5a3c;
  --ok: #0f8a5a;
  --hi: #1d5fe0;
  --pri: #6a5ae0;      /* 기본색: 누른 단추와 주요 단추. 지역을 칠하는 색(--area)과 같은 보랏빛 파랑(인디고) */
  --on-pri: #ffffff;
  --area: #6a5ae0;   /* 고른 지역을 칠하는 색. 카페 점(파랑, 주황, 갈색)이나 지도의 초록, 물색과 겹치지 않는 보라 */
  --sh-1: 0 1px 2px rgba(20, 23, 28, .10), 0 2px 10px rgba(20, 23, 28, .10);
  --sh-2: 0 2px 6px rgba(20, 23, 28, .08), 0 14px 36px rgba(20, 23, 28, .18);
  color-scheme: light;
  --font: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font); font-size: 14px; line-height: 1.45; color: var(--ink); background: var(--bg); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--c-fr); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#app { position: relative; height: 100%; }
#map { position: absolute; inset: 0; background: var(--bg); }
#dots { position: absolute; left: 0; top: 0; pointer-events: none; }

/* 위쪽 한 줄: 검색 + 칩 */
#bar { position: absolute; z-index: 20; top: 14px; left: 14px; right: 14px; display: flex; align-items: flex-start; gap: 10px; pointer-events: none; }
#bar > * { pointer-events: auto; }
.search { display: flex; align-items: center; gap: 8px; width: 300px; flex: none; height: 44px; padding: 0 6px 0 14px; background: var(--surface); border-radius: 14px; box-shadow: var(--sh-1); color: var(--ink-3); }
.srow { display: flex; gap: 8px; flex: none; }
#menuBtn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; background: var(--surface); border-radius: 14px; box-shadow: var(--sh-1); color: var(--ink); }
#menuBtn:hover { background: var(--surface-2); }
#menuBtn svg.i { width: 20px; height: 20px; }
.search:focus-within { color: var(--ink); box-shadow: var(--sh-1), 0 0 0 2px var(--ink); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); font-size: 15px; }
.search input::placeholder { color: var(--ink-3); }
/* 아이폰은 글씨가 16px보다 작은 입력 칸을 누르면 화면 전체를 확대해 버린다. 손가락으로 쓰는 기기에서는 16px로 맞춘다. */
@media (max-width: 760px), (pointer: coarse) { .search input { font-size: 16px; } }
.search input::-webkit-search-cancel-button { display: none; }
#qClear { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-3); }
#qClear:hover { background: var(--surface-2); color: var(--ink); }
#chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; padding-top: 3px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 999px; background: var(--surface); box-shadow: var(--sh-1); font-size: 14px; font-weight: 600; white-space: nowrap; flex: none; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed=true] { background: var(--pri); color: var(--on-pri); }
/* 보너스 카페 칩: 지도의 새 카페 표시와 같은 초록 별. 켜면 칩이 초록이고 별은 흰 동그라미 안의 초록 별 */
.chip .gstar { display: inline-flex; width: 18px; height: 18px; flex: none; }
.chip .gstar svg { width: 100%; height: 100%; }
.chip .gstar .gs-c { fill: #37b24d; } .chip .gstar .gs-s { fill: #fff; }
.chip.bonus[aria-pressed=true] { background: #37b24d; color: #fff; }
.chip.bonus[aria-pressed=true] .gs-c { fill: #fff; } .chip.bonus[aria-pressed=true] .gs-s { fill: #37b24d; }
/* 보너스 카페 판의 줄: 그림, 이름, 받는 XP */
.bsec { display: flex; flex-direction: column; gap: 16px; }
.bsec .blab { display: flex; align-items: center; gap: 9px; min-width: 0; }
.bsec .blab .fxs { width: 26px; height: 26px; }
.bsec .blab small { font-size: 12.5px; font-weight: 650; color: var(--ink-3); white-space: nowrap; }
.bsec .bitem { display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.bsec .bitem:last-child { border-bottom: 0; padding-bottom: 0; }
.bsec .bsub { display: flex; padding-left: 35px; margin-top: -2px; }
.bsec .bgot { flex: none; display: inline-flex; align-items: center; gap: 1px; padding: 0; background: none; color: #6a5ae0; font: inherit; font-size: 13px; font-weight: 650; white-space: nowrap; cursor: pointer; }
.bsec .bgot svg { width: 14px; height: 14px; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.chip svg.i { width: 16px; height: 16px; }
.chip[data-act=want][aria-pressed=true] svg.i { fill: currentColor; }
/* 새로 오픈은 켜면 찜의 분홍과 같은 느낌의 연둣빛 초록. */
.chip[data-act=fresh][aria-pressed=true] { background: #37b24d; color: #fff; }
.chip[data-act=fresh][aria-pressed=true] svg.i { fill: currentColor; }
/* 찜은 켜면 분홍빛 빨강(지도의 하트 표시와 같은 색). */
.chip[data-act=want][aria-pressed=true], .opt.heart[aria-pressed=true] { background: #e64980; border-color: #e64980; color: #fff; }
.chip .sub { display: grid; place-items: center; width: 22px; height: 22px; margin-right: -7px; border-radius: 50%; opacity: .75; }
.chip .sub:hover { opacity: 1; background: rgba(128, 128, 128, .35); }
.chip.crumb { padding: 0 5px 0 12px; gap: 1px; cursor: default; }
.chip.crumb button { height: 28px; padding: 0 7px; border-radius: 999px; font-weight: 600; opacity: .68; display: inline-flex; align-items: center; gap: 3px; }
.chip.crumb button.cur { opacity: 1; }
.chip.crumb button:hover { opacity: 1; background: rgba(128, 128, 128, .32); }
.chip.crumb > svg.i { width: 12px; height: 12px; opacity: .5; }
.chip.crumb > svg.i:first-child { width: 16px; height: 16px; opacity: 1; margin-right: 3px; }
.chip.crumb button svg.i { width: 14px; height: 14px; }
.chip.ghost { background: none; box-shadow: none; color: var(--ink-2); padding: 0 8px; text-shadow: 0 0 6px var(--surface), 0 0 6px var(--surface); }
.chip.ghost:hover { color: var(--ink); }

/* 카드 하나: 메뉴, 목록, 카페 정보가 번갈아 나온다 */
#panel { position: absolute; z-index: 25; width: 360px; max-height: calc(100% - 96px); display: flex; flex-direction: column; background: var(--surface); border-radius: 18px; box-shadow: var(--sh-2); overflow: hidden; }
.ph { display: flex; align-items: center; gap: 6px; padding: 12px 10px 8px 16px; min-height: 52px; flex: none; }
.ph h2 { flex: 1; min-width: 0; margin: 0; font-size: 16px; font-weight: 750; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph h2 small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 6px; font-variant-numeric: tabular-nums; }
.ib { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); flex: none; }
.ib:hover { background: var(--surface-2); color: var(--ink); }
.ph .ib.back { margin-left: -8px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.sort { display: flex; background: var(--surface-2); border-radius: 9px; padding: 2px; flex: none; }
.sort button { font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 5px 10px; border-radius: 7px; }
.sort button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); }

.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 9px 16px; }
.row:hover { background: var(--surface-2); }
.pin { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 13px; font-weight: 750; background: var(--c); color: var(--t, #fff); }
.pin svg.i { width: 16px; height: 16px; }
.pin.logo { background: #fff; box-shadow: 0 0 0 2px var(--c); }
.pin.logo img { width: 68%; height: 68%; object-fit: contain; border-radius: 3px; }
.pin.logo.full img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row .name { font-weight: 650; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .meta > span + span { margin-left: 9px; }
.fsec output .onote { display: block; margin-top: 2px; font-size: 12px; font-weight: 500; color: var(--ink-3); }
.facts dd .bigmark { display: inline-flex; align-items: center; gap: 1px; padding: 1px 6px 1px 8px; border: 1px solid #c9c2f7; border-radius: 999px; background: none; color: #6a5ae0; font: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer; }
.facts dd .bigmark svg { width: 13px; height: 13px; }
/* 대형 기준 창 */
.bigbox .bgrow { display: flex; align-items: center; gap: 12px; margin: 4px 0 6px; }
.bigbox .bgrow b { flex: none; min-width: 74px; text-align: right; font-size: 15px; }
.bigbox .switch { margin: 6px 0 2px; }
.bigbox .bgme { margin: 0; font-size: 13px; color: var(--ink-3); }
.row .tag { flex: none; color: var(--ok); display: grid; }
.row .tag svg.i { width: 16px; height: 16px; }
.sec { padding: 12px 16px 4px; font-size: 12px; font-weight: 650; color: var(--ink-3); letter-spacing: .03em; }
.note { margin: 0; padding: 8px 16px 10px; font-size: 12.5px; color: var(--ink-3); }
.ask { margin: 2px 14px 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-2); }
.ask .btn { flex: none; background: var(--pri); color: var(--on-pri); }
.empty { padding: 28px 24px 30px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty b { font-size: 15px; color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 11px; font-weight: 650; font-size: 14px; background: var(--surface-2); text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--line); }
.btn.pri { background: var(--pri); color: var(--on-pri); }
.btn.pri:hover { opacity: .88; background: var(--pri); }
.btn.sm { height: 34px; font-size: 13px; padding: 0 12px; }
.btn[aria-pressed=true] { background: var(--pri); color: var(--on-pri); }

.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 0 10px 8px; flex: none; }
.crumbs button { font-size: 13.5px; font-weight: 600; color: var(--ink-3); padding: 5px 6px; border-radius: 7px; }
.crumbs button:hover { background: var(--surface-2); color: var(--ink); }
.crumbs button.on { color: var(--ink); }
.crumbs svg.i { width: 13px; height: 13px; color: var(--ink-3); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 2px 14px 12px; }
.cell { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.cell:hover { border-color: var(--ink-3); }
.cell.on { background: var(--pri); border-color: var(--pri); color: var(--on-pri); }
.cell.on small { color: inherit; opacity: .7; }
/* 맨 위의 "전체" 단추(전국, 경기 전체, 수원시 전체 등)는 모두 같은 보랏빛 파랑으로 맞춘다. 지도에서 고른 지역을 칠하는 색과 같다. */
.cell.all { grid-column: 1 / -1; background: rgba(106, 90, 224, .09); border-color: rgba(106, 90, 224, .28); color: var(--area); }
.cell.all span { font-weight: 750; }
.cell.all small { color: inherit; opacity: .75; }
.cell.all.on { background: var(--area); border-color: var(--area); color: #fff; }
/* 전국 단추: 다른 칸 두 개 너비로 길게 놓고, 한 단계 위라는 것이 보이게 옅은 보라 바탕을 깐다. */
.cell.nation { justify-content: center; }
.cell span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cell small { flex: none; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cell:disabled { opacity: .4; cursor: default; }

.inset { margin: 0 14px 6px; width: auto; height: 40px; box-shadow: none; background: var(--surface-2); flex: none; }
.inset:focus-within { box-shadow: 0 0 0 2px var(--ink); }
.pick { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 16px; }
.pick:hover { background: var(--surface-2); }
.pick .box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex: none; color: transparent; }
.pick[aria-pressed=true] .box { background: var(--pri); border-color: var(--pri); color: var(--on-pri); }
.pick .box svg.i { width: 14px; height: 14px; stroke-width: 2.6; }
.pick .name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .pin { width: 28px; height: 28px; font-size: 12.5px; }
.brow { display: flex; align-items: center; }
.brow .pick { flex: 1; min-width: 0; padding-right: 6px; }
.pinbtn { width: 38px; height: 38px; display: grid; place-items: center; flex: none; margin-right: 8px; border-radius: 50%; color: var(--line-2); }
.pinbtn:hover { background: var(--surface-2); color: var(--ink-2); }
.pinbtn[aria-pressed=true] { color: var(--ink); }
.pinbtn[aria-pressed=true] svg.i { fill: currentColor; }
.pinbar { padding: 0 14px 8px; flex: none; display: flex; flex-direction: column; gap: 6px; }
.pinbar .btn { width: 100%; }
.pick small { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 12.5px; }

.pad { padding: 2px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.pad output { font-size: 20px; font-weight: 750; font-variant-numeric: tabular-nums; }
.pad output small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 6px; }
.pad p { margin: 0; font-size: 12.5px; color: var(--ink-3); }
input[type=range] { width: 100%; accent-color: var(--ink); margin: 0; }

.detail { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 12px; }
.detail h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1.3; overflow-wrap: anywhere; }
.kind { display: flex; align-items: center; gap: 7px; margin-top: 4px; color: var(--ink-2); font-size: 13.5px; font-weight: 550; }
.kind .dot { width: 9px; height: 9px; border-radius: 50%; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 0; align-items: center; }
.facts dt { color: var(--ink-3); font-size: 13px; }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.facts dd b { font-weight: 700; font-variant-numeric: tabular-nums; }
.facts dd small { color: var(--ink-3); font-size: 12.5px; }
/* 넓이와 같은 줄에 적는 "개업" 이름표 */
.facts dd .k2 { color: var(--ink-3); font-size: 13px; margin-left: 8px; }
.facts dd small.newmark { display: inline-flex; align-items: center; gap: 3px; color: #2b9a41; font-weight: 650; }
.facts dd small.newmark svg.i { width: 13px; height: 13px; fill: currentColor; }
/* 준비 중일 수 있어요: 새로 연 카페예요와 같은 모양의 분홍 글씨. 누르면 설명이 잠깐 뜬다. */
.facts dd .omark { display: inline-flex; align-items: center; gap: 3px; padding: 0; background: none; color: #d6336c; font-size: 12.5px; font-weight: 650; }
.facts dd .omark svg.i { width: 13px; height: 13px; }
/* 카드 맨 아래에 붙어 있는 단추 줄(필터의 적용하기) */
/* 걷는 길 판 */
.rtbody { padding: 6px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.rtbig { display: flex; align-items: baseline; gap: 8px; }
.rtbig .rtkind { font-size: 13px; font-weight: 700; color: #6a5ae0; }
.rtbig b { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.rtbig small { font-size: 15px; color: var(--ink-3); font-weight: 600; }
.rtbody .btn.ext { display: flex; align-items: center; justify-content: center; height: 46px; border-radius: 12px; font-size: 14.5px; font-weight: 700; text-decoration: none; color: var(--ink); background: var(--surface-2); }
.pfoot { flex: none; padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
.pfoot .btn { width: 100%; height: 46px; border-radius: 12px; font-size: 15px; font-weight: 700; }
.pfoot .btn small { font-weight: 600; opacity: .7; margin-left: 2px; }
/* 메뉴 카드 */
.macc { display: flex; align-items: center; gap: 10px; }
.macc .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.macc .who b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.macc .who small { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mlist a { color: inherit; }
/* 환경설정에서 여러 개 중 하나를 고르는 줄 */
.mopt { display: flex; flex-direction: column; gap: 8px; font-weight: 650; font-size: 15px; }
.mopt .sort { display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; border-radius: 11px; }
.mopt .sort button { height: 32px; font-size: 13px; border-radius: 8px; padding: 0 4px; white-space: nowrap; }

.opts { display: flex; flex-wrap: wrap; gap: 6px; }

/* 카드 맨 아래 줄: 왼쪽에 찜, 오른쪽에 폐업 신고. 폐업 신고는 자주 누르는 단추가 아니라서 테두리 없이 옅게 둔다. */

/* 주소 옆의 길찾기 */
.facts .go { background: none; font-family: inherit; cursor: pointer; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 12.5px; font-weight: 650; }

/* 단추 안에 적는 사람 수(그렇게 기록한 사람이 몇 명인지) */
.opt .n { margin-left: 6px; font-weight: 700; font-variant-numeric: tabular-nums; opacity: .5; }
.opt .n:empty { display: none; }

/* 카드의 투표 칸: 콘센트 좌석. 제목 오른쪽에 몇 명이 투표했는지 적는다. */
.rec { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.rec .vh { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }

.rec .more { display: grid; grid-template-rows: 0fr; margin-top: -8px; transition: grid-template-rows .34s cubic-bezier(.4, 0, .2, 1), margin-top .34s cubic-bezier(.4, 0, .2, 1); }

/* 카페 카드 안에 띄우는 카카오맵, 네이버지도 화면 */

   주소, 넓이, 투표는 머리줄의 "콘센트 기록" 단추를 누르면 지도 위로 내려온다. */
#panel[data-kind=detail][data-embed] { height: 100%; }

.dh { position: relative; display: flex; align-items: center; gap: 8px; padding: 16px 12px 10px 14px; flex: none; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }

.dh .ib { flex: none; }
/* 주소, 넓이, 투표가 든 판을 여닫는 단추. 판이 열려 있으면 화살표가 위를 본다. */
.sum { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 36px; padding: 0 10px 0 13px; border-radius: 999px; border: 1px solid transparent; background: var(--surface-2); font-size: 13px; font-weight: 700; cursor: pointer; }

.prow { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 10px 7px 8px; border-radius: 9px; text-align: left; font-size: 14px; font-weight: 650; }

/* 처음 열 때 자료를 받는 동안 보이는 표시 */

.sk-bar { left: 14px; top: 14px; width: min(300px, calc(100% - 28px)); height: 44px; }
.sk-row { position: absolute; left: 14px; top: 68px; display: flex; gap: 8px; }
.sk-row .sk { position: relative; width: 84px; height: 38px; border-radius: 999px; }
.sk-count { left: 50%; bottom: 22px; width: 150px; height: 44px; margin-left: -75px; border-radius: 999px; background: #d9dce2; box-shadow: none; }
.sk-map { position: absolute; inset: 0; background:
  linear-gradient(115deg, transparent 47%, #fff 47%, #fff 49%, transparent 49%),
  linear-gradient(20deg, transparent 58%, #fff 58%, #fff 59.5%, transparent 59.5%),
  linear-gradient(170deg, transparent 30%, #fbefc0 30%, #fbefc0 32%, transparent 32%); }

@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (max-width: 760px) { .sk-bar { width: calc(100% - 28px); } }
/* 콘센트 기록 단추: 처음 한 번만 살짝 커졌다 돌아오며 눈에 띄게 한다. */

.sum.nudge { animation: nudge .6s ease 0.5s 2; }

.none { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--ink-3); font-size: 13px; }
/* 카드는 아래에서 위로 올라오며 나타난다. */

@media (max-width: 760px) { #panel.rise { animation: sheetUp .32s cubic-bezier(.2, .8, .2, 1); } }
@media (prefers-reduced-motion: reduce) { #panel.rise { animation: none; } }
.dbody { position: relative; flex: 1; min-height: 0; overflow: hidden; border-top: 1px solid var(--line); }
/* 투표할 때 뜨는 로그인 창 */
#login { position: absolute; inset: 0; z-index: 60; background: rgba(15, 20, 30, .45); display: grid; place-items: center; padding: 20px; }
.lbox { width: min(340px, 100%); background: var(--surface); border-radius: 18px; box-shadow: var(--sh-2); padding: 22px 20px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }

/* 다른 사람들이 없어졌다고 알린 카페: 카드 윗줄 아래에 한 줄로 알린다. */
.gonebar { flex: none; padding: 7px 14px; font-size: 12.5px; font-weight: 650; color: var(--ink); background: color-mix(in srgb, #f59f00 16%, var(--surface)); border-top: 1px solid var(--line); }

/* 판은 머리줄 아래에서 아래로 스르륵 내려오고, 닫을 때는 위로 스르륵 올라간다. 닫힌 동안에는 눌리지 않게 숨긴다.
   폰에서는 카드도 같이 오르내리므로(setSnap의 'slow') 둘의 시간과 빠르기 곡선을 똑같이 맞춘다: 천천히 출발해서 천천히 멈춘다. */
.dscrim { position: absolute; inset: 0; z-index: 1; background: rgba(15, 20, 30, .28); opacity: 0; visibility: hidden; transition: opacity .46s ease, visibility 0s .46s; }

@media (min-width: 761px) { #panel[data-kind=detail][data-embed] { width: 440px !important; } }

/* 아래쪽: 개수 단추, 지도 단추 */
#count { position: absolute; z-index: 15; left: 50%; bottom: 22px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 999px; background: var(--pri); color: var(--on-pri); font-weight: 650; box-shadow: var(--sh-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
#count:hover { opacity: .9; }
#count svg.i { width: 16px; height: 16px; }
#ctrl { position: absolute; right: 14px; bottom: 44px; z-index: 15; display: flex; flex-direction: column; gap: 8px; }
#nav { position: absolute; z-index: 15; right: 66px; bottom: 44px; display: flex; gap: 8px; }
#nav { pointer-events: none; }

.npair { display: flex; gap: 8px; }
.nbtn { display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 16px 0 13px; border-radius: 12px; background: var(--surface); box-shadow: var(--sh-1); font-weight: 650; white-space: nowrap; }
.nbtn[aria-pressed=true] { background: var(--pri); color: var(--on-pri); }
/* 마우스를 올렸을 때의 색은 마우스가 있는 기기에서만. 폰에서는 손가락을 뗀 뒤에도 그 색이 남아서 눌린 것처럼 보인다. */
@media (hover: hover) { .nbtn:hover { background: var(--pri); color: var(--on-pri); } }
/* "OO 전체 보기"와 "동별로 보기"를 오갈 때 동전처럼 뒤집힌다. */

@media (prefers-reduced-motion: reduce) { #navAll.flip { animation: none; } }
.cbtn { width: 42px; height: 42px; display: grid; place-items: center; background: var(--surface); border-radius: 12px; box-shadow: var(--sh-1); color: var(--ink); }
.cbtn:hover { background: var(--surface-2); }
.cgroup { display: flex; flex-direction: column; background: var(--surface); border-radius: 12px; box-shadow: var(--sh-1); overflow: hidden; }
.cgroup .cbtn { box-shadow: none; border-radius: 0; }
.cgroup .cbtn + .cbtn { border-top: 1px solid var(--line); }
#toast.new { background: #37b24d; color: #fff; }
/* XP를 받았을 때 뜨는 풍선: "+N XP"와 받은 까닭 한 줄. 카드와 지도를 가리지 않게 화면 맨 아래에 뜬다. */
#toast.xp { z-index: 70; background: var(--pri); color: #fff; padding: 11px 18px; border-radius: 999px; display: flex; align-items: baseline; gap: 10px; animation: xpPop .28s cubic-bezier(.2, .9, .3, 1.3); }

@keyframes xpOut { from { transform: translateX(-50%); opacity: 1; } to { transform: translateX(-50%) translateY(14px) scale(.9); opacity: 0; } }
@keyframes xpPop { from { transform: translateX(-50%) translateY(14px) scale(.9); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
/* 레벨 업 장면: 화면 전체를 덮고, 확인을 눌러 닫는다. */
#lvup { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(30, 22, 80, .9); animation: lvFade .25s ease; }
#lvup .box { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #fff; text-align: center; padding: 24px; }
#lvup .cap { font-size: 15px; font-weight: 700; letter-spacing: .28em; opacity: .85; animation: lvRise .5s .1s both; }
#lvup .num { font-size: 84px; font-weight: 900; line-height: 1; letter-spacing: -.03em; animation: lvPop .6s .18s cubic-bezier(.2, .9, .3, 1.4) both; }

/* 축하 장면(생애 첫, 달성 보너스) */

#celeb.out { opacity: 0; transition: opacity .2s ease; }
#celeb .cc { position: relative; width: min(256px, 74vw); padding: 26px 20px 22px; border-radius: 22px; background: var(--surface); box-shadow: 0 12px 32px rgba(0, 0, 0, .16); display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; animation: ccPop .35s cubic-bezier(.2, .9, .3, 1.25); }
#celeb .md { position: relative; width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; color: var(--c1); background: color-mix(in srgb, var(--c1) 13%, var(--surface)); animation: mdPop .45s .05s cubic-bezier(.2, .9, .3, 1.5) both; }
#celeb .md svg.i { width: 30px; height: 30px; }
/* 로티 그림 칸과 화면 가득 폭죽, 확인 단추 */
#celeb .md.lt { width: 132px; height: 132px; margin: -6px 0 -10px; border-radius: 0; background: none; }
#celeb .cf, #lvup .cf { position: absolute; inset: 0; pointer-events: none; }
#celeb .cc { z-index: 1; }
#celeb .cc .btn { align-self: stretch; height: 46px; margin-top: 14px; border-radius: 13px; font-size: 15px; }
#lvup .box { position: relative; z-index: 1; }
#lvup .lart { width: 124px; margin: 0 auto -4px; }
#lvup .lart .fx { width: 100%; }
#celeb .ct { margin-top: 12px; font-size: 12.5px; font-weight: 700; color: var(--c1); }
#celeb .cn { font-size: 18px; font-weight: 800; }
#celeb .cx { margin-top: 2px; color: var(--c1); font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; animation: lvRise .4s .3s both; }
#celeb .bs { display: none; position: absolute; left: 50%; top: 56px; width: 0; height: 0; }
#celeb .bs i { position: absolute; left: -3.5px; top: -3.5px; width: 7px; height: 7px; border-radius: 2px; background: var(--c1); opacity: 0; animation: bsFly .8s var(--d) ease-out forwards; }
#celeb .bs i:nth-child(3n) { background: var(--c2); border-radius: 50%; }
#celeb .bs i:nth-child(4n) { background: #6a5ae0; }
@keyframes ccPop { from { transform: scale(.6); opacity: 0; } }
@keyframes mdPop { from { transform: scale(.4); opacity: 0; } }
@keyframes bsFly { 0% { transform: translate(0, 0) scale(.6); opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(1) rotate(200deg); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #celeb, #celeb *:not(.fx *) { animation: none !important; } #celeb .bs { display: none; } }
#lvup .got { margin-top: 18px; width: min(280px, 80vw); display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 16px; background: rgba(255, 255, 255, .12); animation: lvRise .5s .6s both; }
#lvup .got .gr { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
#lvup .got .gr b { font-weight: 800; color: #ffe066; white-space: nowrap; }
#lvup .ring { position: absolute; width: 220px; height: 220px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .5); animation: lvRing 1s .2s ease-out both; pointer-events: none; }
#lvup button { margin-top: 26px; height: 46px; padding: 0 44px; border-radius: 999px; background: #fff; color: var(--pri); font-size: 16px; font-weight: 800; animation: lvRise .5s .7s both; }
#lvup .num.bump { animation: lvBump .22s ease-out; }
#lvup .num.done { animation: lvDone .5s cubic-bezier(.2, .9, .3, 1.5); text-shadow: 0 0 28px rgba(255, 255, 255, .55); }
@keyframes lvBump { 40% { transform: translateY(-8px) scale(1.08); } }
@keyframes lvDone { 0% { transform: scale(1); } 45% { transform: scale(1.28); } 100% { transform: scale(1); } }
@keyframes lvFade { from { opacity: 0; } }
@keyframes lvPop { from { transform: scale(.3); opacity: 0; } }
@keyframes lvRise { from { transform: translateY(12px); opacity: 0; } }
@keyframes lvRing { from { transform: scale(.4); opacity: 1; } to { transform: scale(2.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #toast.xp, #lvup, #lvup *:not(.fx *) { animation: none !important; } }
/* 카드의 방문 인증 줄 */
.xvisit { display: flex; flex-direction: column; gap: 6px; }
/* 방문 인증 단추: 앱의 다른 단추처럼 차분하게. 흰 바탕에 보라 테두리, 왼쪽 도장 아이콘, 오른쪽 받을 XP. */
.xgo { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; padding: 9px 14px; border-radius: 14px; text-align: left; background: var(--surface); border: 1.5px solid var(--pri); color: var(--pri); }
.xgo:hover { background: color-mix(in srgb, var(--pri) 6%, var(--surface)); }
.xgo:disabled { opacity: .6; }
.xgo.done { opacity: 1; border-color: var(--line-2); background: var(--surface-2); color: var(--ink-3); }
.xgo.done .xgt b { color: var(--ink-3); }
.rec .opts.busy { opacity: .5; pointer-events: none; }
.xgo .xgi { flex: none; display: grid; place-items: center; }
.xgo .xgi svg.i { width: 20px; height: 20px; }
.xgo .xgt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.xgo .xgt b { font-size: 15px; font-weight: 750; color: var(--ink); }
.xgo .xgb { font-size: 12px; color: var(--ink-3); }
.xgo .xgb[hidden] { display: none; }
.xgo .xgx { flex: none; font-size: 14px; font-weight: 750; color: var(--pri); font-variant-numeric: tabular-nums; }
.xgo .xgx:empty { display: none; }
/* 투표 단추 줄의 세로 구분선(일반 의자와 없어요 사이) */
.rec .opts.four .vsep { flex: none; width: 1px; align-self: stretch; margin: 6px 2px; background: var(--line-2); }
.xgo[hidden] { display: none; }
.xdone, .xhint { font-size: 12.5px; color: var(--ink-3); }
.xdone:empty { display: none; }
.rec .opts.four .opt { font-size: 12px; padding: 0 3px; }
.rec .opts.four .opt .n { margin-left: 3px; }
/* 폰처럼 좁을 때: 단추 이름이 길어서(바테이블 의자) 기록 수는 이름 아래 줄에 작게 */
@media (max-width: 520px) {
  .rec .opts.four { align-items: stretch; }
  .rec .opts.four .opt { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; height: auto; min-height: 40px; padding: 5px 3px; line-height: 1.15; }
  .rec .opts.four .opt .n { margin-left: 0; font-size: 11px; }
}
.opt:disabled { opacity: .4; cursor: default; }
/* 메뉴의 레벨 칸과 보상 체계 */
.xlv { display: flex; flex-direction: column; gap: 4px; }
.xlv .top { display: flex; justify-content: space-between; align-items: baseline; }
.xlv .top b { font-size: 24px; font-weight: 800; }
.xlv .top span, .xlv p { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin: 0; }
.xnote { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-3); }
/* 메뉴의 레벨 칸(누르면 XP 기록) */
button.xlvbtn { width: 100%; display: flex; flex-direction: row; align-items: center; gap: 10px; text-align: left; padding: 4px 0; }
/* 메뉴의 레벨 밑 한 줄: 맨 왼쪽 기록한 카페, 오른쪽 셋은 옅은 회색 바탕에 "N곳 중"과 가로선 아래 세 칸 */
.xstat.x4b { grid-template-columns: 1.15fr 3fr; }
.xstat.x4b .grp { display: flex; flex-direction: column; background: var(--surface-2); padding-top: 9px; }
.xstat.x4b .hd { margin: 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); text-align: center; font-size: 11px; font-weight: 700; color: var(--ink-3); }
.xstat.x4b .cols { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); }
.xstat.x4b .cols button + button::before { top: 9px; bottom: 13px; }
.xstat.x4b > button { justify-content: center; }
.xstat.x4b > button b { font-size: 20px; }
.xstat.x4b > button span { font-size: 11.5px; white-space: normal; text-align: center; line-height: 1.3; word-break: keep-all; }
.xstat.static > div span { white-space: normal; text-align: center; line-height: 1.3; word-break: keep-all; }
.xstat.x4b .cols button { justify-content: center; gap: 2px; padding: 8px 2px 12px; }
.xstat.x4b .cols b { font-size: 18px; }
.xstat.x4b .cols span { font-size: 11.5px; }
/* 기록 보너스 창: "N곳 중" 묶음(왼쪽 세로줄)과 목록 표시(초록 새로 연 카페, 파랑 오랜만의 기록) */
.xsub { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 2px 2px; padding: 2px 0 2px 12px; border-left: 2px solid var(--line); }
.xsub .of { font-size: 12px; font-weight: 700; color: var(--ink-3); }
.xsub .r { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 2px; font-size: 13.5px; color: var(--ink-2); }
.xsub .r b { font-size: 15px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.xsub .r b small { margin-left: 1px; font-size: 12px; font-weight: 650; color: var(--ink-2); }
.xli .vtags { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.xli .vtag { font-size: 12px; font-weight: 700; white-space: nowrap; }
.xli .vtag.new { color: #2b8a3e; }
.xli .vtag.old { color: #1c7ed6; }
.xstat .pr { display: flex; align-items: center; gap: 5px; width: calc(100% - 16px); margin-top: 3px; }
.xstat .pb { flex: 1; height: 4px; border-radius: 99px; background: color-mix(in srgb, var(--c) 18%, var(--surface)); overflow: hidden; }
.xstat .pb i { display: block; height: 100%; border-radius: 99px; background: var(--c); }
.xstat span.of { flex: none; font-size: 10.5px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.xstat .g.vote { --c: #f76707; }
.xstat .g.dong { --c: #0ca678; }
/* 네 칸 상자(메뉴의 레벨 밑, 랭킹에서 누른 사람 창): 흰 카드 하나를 가는 선으로 나눈다 */
.xstat { display: grid; grid-template-columns: repeat(4, 1fr); margin: 6px 0 8px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
.xstat button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 13px 2px 12px; background: none; border-radius: 0; }
.xstat button + button::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 1px; background: var(--line); }
.xstat button:active { background: var(--surface-2); }
.xstat b { font-size: 19px; font-weight: 800; letter-spacing: -.01em; color: var(--ink); font-variant-numeric: tabular-nums; }
.xstat b small { margin-left: 1px; font-size: 12px; font-weight: 650; color: var(--ink-2); }
.xstat span { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
button.xlvbtn .top { display: flex; justify-content: space-between; align-items: baseline; width: 100%; }
button.xlvbtn .xlvtxt { flex: 1; display: flex; flex-direction: column; gap: 4px; }
button.xlvbtn > svg.i { width: 16px; height: 16px; opacity: .45; flex: none; }
/* XP 기록 창 */
.xlsum { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--pri) 9%, var(--surface)); margin-top: 6px; }
.xlsum b { font-size: 22px; font-weight: 800; }
.xlsum span { font-size: 15px; font-weight: 700; color: var(--pri); }
.xll { display: flex; flex-direction: column; overflow-y: auto; max-height: 52vh; margin-top: 4px; }
.xli { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.xli > span { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.xli .rs { font-size: 14px; font-weight: 650; }
.xli small { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec .vh .vwho { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; text-decoration: underline; text-underline-offset: 2px; }
.xli.admin .rs { color: var(--pri); }
.xbox .xadm { margin-top: 8px; color: var(--ink-2); font-size: 13px; line-height: 1.5; }
.xbox .xexp { margin: 0 0 2px; color: var(--ink-2); font-size: 13.5px; line-height: 1.55; }
.xbox .xnone { padding: 14px 2px; color: var(--ink-3); font-size: 13.5px; }
button.xlink.xrow b { margin-right: 6px; }
.xli .rt { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.xli b { font-size: 14px; font-weight: 750; color: var(--pri); font-variant-numeric: tabular-nums; }
.xli.minus b { color: var(--ink-3); }
/* XP 받는 법: 콘센트 기록 아래 들여 쓴 묶음(첫 기록, 이런 곳이면 더) */
.xnest { display: flex; flex-direction: column; margin: 0 0 2px 13px; padding-left: 12px; border-left: 2px solid var(--line); }
.xnest .xnh { font-size: 12px; font-weight: 700; color: var(--ink-3); margin: 6px 0 0; }
/* XP 받는 법 창은 줄 사이를 넉넉히(사용자: 너무 촘촘하다, 세로로 길게) */
.xbox.roomy button.xlink.xrow { padding: 12px 0; }
.xbox.roomy > .xrow:not(.xlink) { padding: 9px 0; }
.xbox.roomy .xgrp { margin-top: 14px; margin-bottom: 2px; }
.xbox.roomy .xnest { margin-top: 2px; }
.xbox.roomy .xnest .xnh { margin: 12px 0 2px; }
.xbox.roomy .xsep { margin: 14px 0 0; }
.xbox.roomy > p { margin-bottom: 4px; }
/* ===== 새 동네 지도(창) ===== */
#dmap { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 12px; background: rgba(15, 20, 30, .5); --dmc: #7b6cf6; --dmc2: #5b4bdb; }
#dmap.out { opacity: 0; transition: opacity .18s ease; }
.dmbox { width: min(440px, 100%); height: min(780px, 100%); display: flex; flex-direction: column; background: var(--surface); border-radius: 18px; box-shadow: var(--sh-2); overflow: hidden; }
.dmbox .dmhead { display: flex; align-items: center; gap: 10px; padding: 18px 18px 0; margin: 0; }
.dmbox .dmhead h2 { margin: 0; font-size: 18px; font-weight: 800; }
.dmsum { display: flex; gap: 6px; padding: 10px 18px 12px; }
.dmsum span { display: inline-flex; align-items: baseline; gap: 5px; padding: 5px 11px; border-radius: 999px; background: var(--surface-2); }
.dmsum small { font-size: 11.5px; font-weight: 650; color: var(--ink-3); }
.dmsum b { font-size: 14.5px; font-weight: 800; color: var(--dmc2); font-variant-numeric: tabular-nums; }
.dmmap { position: relative; flex: 1; min-height: 0; margin: 0 12px; border-radius: 16px; overflow: hidden; background: #a9dcf2; }
.dmcv { position: absolute; inset: 0; opacity: 0; transition: opacity .3s ease; }
.dmmap.ready .dmcv { opacity: 1; }
.dmfoot { padding: 12px 18px 16px; }
.dmfoot .btn { width: 100%; height: 46px; border-radius: 13px; font-size: 15px; }
/* 지도 안 왼쪽 위: 새 동네 보너스 현황 창을 여는 단추 */
.dmbonus { position: absolute; z-index: 4; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px 0 10px; border-radius: 999px; background: var(--surface); box-shadow: 0 2px 8px rgba(40, 30, 90, .18); font-size: 12.5px; font-weight: 700; color: var(--ink); }
.dmbonus svg.i { width: 16px; height: 16px; color: var(--dmc); }
.dmbonus svg.i:last-child { width: 13px; height: 13px; color: var(--ink-3); }
.dmbonus b { font-weight: 800; color: var(--dmc2); font-variant-numeric: tabular-nums; }
/* 지역 이름표 */
.dmpw { pointer-events: none; }
.dmpill { pointer-events: auto; display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: 14px; background: var(--surface); box-shadow: 0 2px 7px rgba(60, 40, 20, .2); font-size: 12.5px; font-weight: 650; color: #a8916f; white-space: nowrap; animation: dmPop .28s var(--dl, 0s) cubic-bezier(.2, .9, .3, 1.4) both; }
.dmpill.on { color: var(--ink); }
.dmpill b { font-weight: 800; color: var(--dmc2); }
.dmpill:hover { background: #f6f3ff; }
.dmpill.done { color: #fff; background: linear-gradient(135deg, #7b6cf6, #a18bff); box-shadow: 0 3px 10px rgba(91, 75, 219, .35); }
.dmpill.done b { color: #fff; }
.dmpill .dmsx { width: 14px; height: 14px; margin: -1px -2px 0 -3px; }
.dmpw.hid { visibility: hidden; }
@keyframes dmPop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.dmsx { display: inline-block; flex: none; }
.dmsx svg { display: block; width: 100%; height: 100%; }
/* 도장: 보라 잉크, 점선 테두리, 위에 노란 별 */
.dmsw { pointer-events: none; }
.dmstamp { pointer-events: auto; position: relative; width: 54px; height: 54px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0 5px; color: var(--dmc2); background: rgba(246, 243, 255, .94); border: 2px solid var(--dmc); box-shadow: 0 3px 8px rgba(90, 70, 210, .22); transform: rotate(var(--r, -8deg)); font-family: var(--font); line-height: 1.1; text-align: center; }
.dmstamp::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 1.2px dashed rgba(123, 108, 246, .55); pointer-events: none; }
.dmstamp .nm { font-size: var(--fs, 12px); font-weight: 850; letter-spacing: -.03em; white-space: nowrap; }
.dmstamp .dt { font-size: 9px; font-weight: 750; color: #8b7cf8; font-variant-numeric: tabular-nums; }
.dmstamp .dmsx { position: absolute; left: 50%; top: -8px; width: 16px; height: 16px; margin-left: -8px; }
#dmap:not(.deep) .dmsw { visibility: hidden; }
#dmap.deep .dmsw .dmstamp:not(.hit) { visibility: hidden; }
.dmstamp.hit { animation: dmThunk .34s var(--dl, 0s) cubic-bezier(.2, .9, .3, 1.5) both; }
@keyframes dmThunk { from { transform: scale(1.8) rotate(calc(var(--r, -8deg) - 24deg)); opacity: 0; } 70% { opacity: 1; } to { transform: rotate(var(--r, -8deg)); opacity: 1; } }
/* 지도 안 아래: 지금 보는 지역, 뒤로, 처음부터 */
.dmnav { position: absolute; z-index: 4; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
.dmnav .nbtn { width: 38px; height: 38px; padding: 0; justify-content: center; border-radius: 50%; }
.dmnav .nbtn .t { display: none; }
.dmnav .nbtn svg.i { width: 18px; height: 18px; }
.dmwhere { position: absolute; z-index: 4; left: 10px; bottom: 10px; max-width: calc(100% - 70px); height: 32px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; background: var(--surface); box-shadow: 0 2px 8px rgba(40, 30, 90, .16); font-size: 12.5px; font-weight: 750; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dmwhere.done { color: #fff; background: linear-gradient(135deg, #7b6cf6, #a18bff); animation: dmPop .35s cubic-bezier(.2, .9, .3, 1.5) both; }
.dmwhere .dmsx { width: 15px; height: 15px; }
/* 동을 누르면 지도 아래에 뜨는 카드 */
.dmcard { position: absolute; z-index: 5; left: 8px; right: 8px; bottom: 8px; padding: 12px 12px 12px; border-radius: 14px; background: var(--surface); box-shadow: 0 6px 20px rgba(40, 30, 90, .22); display: flex; flex-direction: column; gap: 10px; animation: dmUp .24s cubic-bezier(.2, .9, .3, 1.15) both; }
@keyframes dmUp { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.dmcard .row { display: flex; align-items: center; gap: 12px; }
.dmcard .mini { flex: none; width: 46px; height: 46px; display: grid; place-items: center; }
.dmcard .mini .dmstamp { width: 44px; height: 44px; --fs: 9.5px !important; }
.dmcard .mini .dmstamp .dt { display: none; }
.dmcard .mini .dmstamp .dmsx { top: -7px; width: 13px; height: 13px; margin-left: -6.5px; }
.dmcard .mini.no { border-radius: 50%; border: 2px dashed #d9ccb6; color: #b9a587; font-size: 18px; font-weight: 800; }
.dmcard .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.dmcard .tx b { font-size: 16.5px; font-weight: 800; }
.dmcard .tx small { font-size: 12.5px; color: var(--ink-3); }
.dmcard .tx span { font-size: 13.5px; font-weight: 650; color: var(--ink-2); }
.dmcard .tx span.on { color: var(--dmc2); }
.dmcard .cx { align-self: flex-start; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; }

.hidin { display: flex; flex-direction: column; gap: 6px; min-height: 0; }

.xms span.u50.opened::after { content: ""; position: absolute; inset: -4px; border-radius: 18px; border: 2.5px solid #ffd86b; pointer-events: none; animation: u50Ring .7s ease-out forwards; }
@keyframes u50Shake { 0%, 100% { transform: none; } 15% { transform: rotate(-7deg) scale(1.05); } 30% { transform: rotate(7deg) scale(1.08); } 45% { transform: rotate(-6deg) scale(1.1); } 60% { transform: rotate(6deg) scale(1.12); } 80% { transform: scale(1.16); } }
@keyframes u50Open { from { transform: scale(1.3); filter: brightness(1.7); } to { transform: none; filter: none; } }
@keyframes u50Ring { from { opacity: 1; transform: scale(.85); } to { opacity: 0; transform: scale(1.35); } }
@keyframes hdIn { from { opacity: 0; transform: translateY(6px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes hdSpin { from { transform: rotate(-180deg) scale(.3); } to { transform: none; } }
@keyframes hdFlip { from { opacity: 0; transform: perspective(300px) rotateY(90deg) scale(.8); } to { opacity: 1; transform: none; } }
#celeb.hidden { --c1: #c27c00; --c2: #ffd86b; }
#celeb .cs { margin-top: 6px; font-size: 13px; color: var(--ink-2); word-break: keep-all; }
#celeb .cc .two .btn { white-space: nowrap; }
.fx-chest .glow { opacity: 0; transform-origin: center; animation: chGlow .6s .75s ease-out forwards; }
.fx-chest .body { transform-origin: center bottom; animation: fxPop .35s cubic-bezier(.2, .9, .3, 1.3) both, chShake .36s .35s ease-in-out; }
.fx-chest .lid { transform-origin: 15% 100%; animation: fxPop .35s cubic-bezier(.2, .9, .3, 1.3) both, chLid .45s .72s cubic-bezier(.2, .9, .3, 1.4) forwards; }
.fx-chest .coins circle { opacity: 0; transform-origin: center; animation: chCoin .5s var(--d) cubic-bezier(.2, .9, .3, 1.6) forwards; }
@keyframes chGlow { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }
@keyframes chShake { 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
@keyframes chLid { from { transform: none; } to { transform: translate(-1px, -5px) rotate(-24deg); } }
@keyframes chCoin { from { opacity: 0; transform: translateY(7px) scale(.4); } to { opacity: 1; transform: none; } }
.xms.hscroll { display: flex; overflow-x: auto; cursor: grab; user-select: none; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 2px; -webkit-overflow-scrolling: touch; mask-image: linear-gradient(90deg, transparent, #000 18px); }
.xms.hscroll::-webkit-scrollbar { display: none; }
.xms.hscroll span { flex: 0 0 calc((100% - 27px) / 4); scroll-snap-align: end; }
.xhd { display: flex; align-items: center; gap: 5px; margin: 4px 2px -4px; font-size: 12px; font-weight: 800; color: #b7791f; }
.xhd svg.i { width: 14px; height: 14px; }
.xms span.hd { background: #221c45; color: rgba(255, 216, 107, .7); }

.xms span.hd.got svg.i { opacity: 1; }
.xms span.hd.next { background: #fff8e1; color: #b7791f; box-shadow: inset 0 0 0 1.5px #f0b429; }

.xms span.next svg.i { opacity: 1; }
/* 표 위: 지금 몇 곳인지, 다음 보너스가 얼마인지, 거기까지 얼마나 왔는지(칸 하나가 카페 한 곳). */
.xprog .of { display: inline; font-size: 15px; font-weight: 700; color: var(--ink-3); }
.xpbar { margin-top: -6px; padding: 4px 14px 14px; border-radius: 0 0 14px 14px; background: color-mix(in srgb, var(--pri) 9%, var(--surface)); }
.xpbar .tr { height: 10px; border-radius: 999px; background: color-mix(in srgb, var(--pri) 20%, var(--surface)); overflow: hidden; }
.xpbar i { display: block; height: 100%; border-radius: 999px; background: var(--pri); }
.xprog { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px; padding: 12px 14px 10px; border-radius: 14px 14px 0 0; background: color-mix(in srgb, var(--pri) 9%, var(--surface)); }
.xprog small { display: block; font-size: 11.5px; color: var(--ink-3); }
.xprog b { font-size: 22px; font-weight: 800; line-height: 1.2; }
.xprog .r { text-align: right; }
.xprog .r b { font-size: 16px; color: var(--pri); }
/* 달성 보너스: 메뉴에서는 다음 목표 한 줄만 보이고, 누르면 전체 표가 든 창이 위에 뜬다. */
button.xlink { width: 100%; align-items: center; text-align: left; padding: 7px 0; }
button.xlink span { flex: 1; }
button.xlink svg.i { width: 15px; height: 15px; opacity: .5; flex: none; }
#xinfo { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; padding: 18px; background: rgba(15, 20, 30, .5); }
/* 키보드가 떠 있을 때: 창을 위에 붙이고, 글 쓰는 칸을 줄여서 보내기 단추까지 키보드 위에 보이게 한다. */
#xinfo.kb { align-items: start; padding: 10px 14px; }
#xinfo.kb .xbox { max-height: 100%; }
#xinfo.kb .xbox > p { display: none; }
#xinfo.kb textarea { min-height: 90px; height: 90px; }
.xbox { width: min(360px, 100%); max-height: calc(100% - 20px); overflow-y: auto; background: var(--surface); border-radius: 18px; box-shadow: var(--sh-2); padding: 20px 18px 16px; display: flex; flex-direction: column; gap: 6px; }

.xbox .btn { margin-top: 12px; align-self: stretch; height: 44px; flex: none; }
.xbox .two .btn { align-self: auto; }
.xbox .xrow { align-items: center; }
#toast { width: max-content; position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%); z-index: 40; background: var(--inv); color: var(--on-inv); padding: 10px 16px; border-radius: 10px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--sh-2); }
.maplibregl-map { font-family: var(--font); }
.maplibregl-ctrl-attrib { background: color-mix(in srgb, var(--surface) 85%, transparent) !important; color: var(--ink-3); font-size: 11px; }
.maplibregl-ctrl-attrib a { color: var(--ink-3); }
/* 내 위치: 카페 점(파랑, 주황, 갈색)과 헷갈리지 않게 빨간 바탕에 사람 모양을 넣는다. */
/* 내 위치: 빨간 동그라미 안에 우리 캐릭터 컵, 보는 방향 부채꼴(나침반을 쓸 수 있을 때만). 빨강은 앱의 보라와 겹치지 않아 눈에 띈다. */
.me { position: relative; width: 70px; height: 70px; pointer-events: none; }
.me .cone { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .3s; }
.me.has-dir .cone { opacity: 1; }
.me .cone path { fill: rgba(229, 72, 77, .26); }
.me .dot { position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: #e5484d; border: 2.5px solid #fff; box-shadow: 0 0 0 6px rgba(229, 72, 77, .18), 0 2px 5px rgba(0, 0, 0, .3); display: grid; place-items: center; }
.me .dot .fxs { width: 20px; height: 20px; margin-top: -1px; }
.me .dot circle { transition: transform .25s ease-out; }
.me .dot .eyes { transform-box: fill-box; transform-origin: center; transition: transform .07s ease-in-out; }

@media (max-width: 760px) {
  #bar { top: calc(10px + env(safe-area-inset-top, 0px)); left: 0; right: 0; flex-direction: column; gap: 0; }
  .srow { align-self: stretch; margin: 0 12px; }
  .search { width: auto; flex: 1; min-width: 0; height: 46px; }
  #menuBtn { width: 46px; height: 46px; }
  #chips { flex-wrap: nowrap; overflow-x: auto; align-self: stretch; gap: 6px; padding: 8px 12px 10px; scrollbar-width: none; }
  /* 칩 네 개(지역, 필터, 찜, 새로 연 카페)가 폰 한 줄에 들어오게 조금 좁힌다. */
  #chips .chip { padding: 0 11px; gap: 5px; }
  #chips::-webkit-scrollbar { display: none; }
  #panel { left: 0 !important; right: 0; top: auto !important; bottom: 0; width: auto !important; max-height: 62% !important; border-radius: 20px 20px 0 0; }
  #panel[data-kind=region], #panel[data-kind=filter], #panel[data-kind=search], #panel[data-kind=list] { max-height: 74% !important; }
  #panel[data-kind=detail][data-embed], #panel[data-kind=list] { max-height: 94% !important; }
  /* 목록 카드도 카페 카드처럼 전체 높이로 만들어 두고 아래로 밀어서 반만 보이게 한다. */
  #panel[data-kind=list] { height: 100%; }
  /* 폰의 카드는 모두 같은 방식이다: 윗줄에 손잡이 막대가 있고, 윗줄을 잡고 끌어내리면 닫힌다. X 단추는 두지 않는다. */
  .ph { position: relative; padding-top: 18px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .ph::before { content: ""; position: absolute; left: 50%; top: 6px; width: 38px; height: 4px; margin-left: -19px; border-radius: 2px; background: var(--line-2); }
  .ph .ib[aria-label="닫기"] { display: none; }
  /* 아래쪽 단추. 가운데에 "이 화면 N곳", 오른쪽 아래에 둥근 단추를 쌓는다(위에서부터 뒤로, 처음부터, 내 위치).
     내 위치가 늘 맨 아래에 있고, 지역 안으로 들어가면 그 위에 두 개가 더 생긴다. */
  #count { height: 44px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
  #ctrl { right: 12px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
  #ctrl .cgroup { display: none; }
  #ctrl .cbtn { width: 44px; height: 44px; border-radius: 50%; }
  #nav { display: contents; }
  #nav[hidden] { display: none; }
  .npair { position: absolute; z-index: 15; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); flex-direction: column; gap: 10px; }
  .npair .nbtn { width: 44px; height: 44px; padding: 0; justify-content: center; border-radius: 50%; }
  .npair .nbtn .t { display: none; }
  .npair .nbtn svg.i { width: 20px; height: 20px; }
  /* "OO구 전체 보기"는 개수 단추 바로 위 가운데. */
  #navAll { position: absolute; z-index: 15; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); height: 40px; border-radius: 999px; }
  /* 지도 출처(i)는 왼쪽 아래 구석. */
  .maplibregl-ctrl-bottom-left { left: 12px; bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
  .maplibregl-ctrl-bottom-left .maplibregl-ctrl-attrib { margin: 0; }
  .sheet-open #count, .sheet-open #ctrl, .sheet-open #nav, .sheet-open .maplibregl-ctrl-bottom-left { display: none; }
  #toast { bottom: auto; top: calc(122px + env(safe-area-inset-top, 0px)); }
  #toast.xp { top: auto; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
}

/* ===== 직접 그린 그림과 그림마다 다른 움직임 ===== */
.fx { position: relative; width: 100%; aspect-ratio: 1; }
.fx svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.fxd svg * { transform-box: fill-box; }
.fx .sp { opacity: 0; transform-origin: center; animation: fxSpark 1.3s var(--d, .8s) ease-in-out both; }
@keyframes fxSpark { 0% { transform: scale(0) rotate(0); opacity: 0; } 25% { transform: scale(1.15) rotate(30deg); opacity: 1; } 60% { transform: scale(.85) rotate(55deg); opacity: 1; } 100% { transform: scale(0) rotate(90deg); opacity: 0; } }
@keyframes fxPop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes fxBurst { 0% { transform: scale(.5); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1.25); opacity: 0; } }
@keyframes stHit { 30% { transform: scale(1.03, .94); } 100% { transform: scale(1); } }
@keyframes stMark { from { transform: scale(1.6) rotate(-12deg); opacity: 0; } to { transform: scale(1) rotate(-12deg); opacity: 1; } }

/* 반짝이를 남기는 안: 떴다가 작게 줄어 그 자리에서 천천히 깜빡인다 */
.fx.keep .sp { animation: fxSpark2 1.1s var(--d) ease-in-out both, fxTw 1.8s calc(var(--d) + 1.1s) ease-in-out infinite; }
@keyframes fxSpark2 { 0% { transform: scale(0) rotate(0); opacity: 0; } 30% { transform: scale(1.15) rotate(30deg); opacity: 1; } 100% { transform: scale(.72) rotate(90deg); opacity: 1; } }
@keyframes fxTw { 0%, 100% { transform: scale(.72) rotate(90deg); opacity: 1; } 50% { transform: scale(.42) rotate(90deg); opacity: .55; } }
/* 번개를 남기는 안 */
.fx .bo { transform-origin: center; animation: fxBo .45s var(--d) cubic-bezier(.2, .9, .3, 1.6) both; }
@keyframes fxBo { from { transform: scale(0) rotate(-25deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }

/* 레벨 단계 캐릭터 움직임 */
[class*="fx-tier"] .lvb { transform-origin: 50% 100%; animation: fxPop .35s cubic-bezier(.2, .9, .3, 1.3) both; }
[class*="fx-tier"] .seed { transform-origin: 50% 100%; animation: lvSeed .55s .35s cubic-bezier(.2, .9, .3, 1.6) both; }
[class*="fx-tier"] .drp { animation: lvDrip .7s .3s cubic-bezier(.5, 0, .7, 1) both; }
[class*="fx-tier"] .sprout, [class*="fx-tier"] .tree { transform-origin: 50% 100%; animation: lvGrow .6s .3s cubic-bezier(.2, .9, .3, 1.25) both; }
[class*="fx-tier"] .fl, [class*="fx-tier"] .ch { transform-origin: center; animation: lvBloom .42s var(--d) cubic-bezier(.2, .9, .3, 1.7) both; }
[class*="fx-tier"] .bean { animation: lvDrop .55s .05s cubic-bezier(.3, 1.3, .4, 1) both; }
[class*="fx-tier"] .wv path, [class*="fx-tier"] .stm path { animation: lvSteam 1.4s var(--d) ease-out both; }
[class*="fx-tier"] .drops ellipse { animation: lvSteam 1s var(--d) ease-out both; }
[class*="fx-tier"] .hp { transform-origin: center; animation: ltHp .9s .8s cubic-bezier(.2, .9, .3, 1.3) both; }
[class*="fx-tier"] .apr { transform-origin: 50% 0; animation: lvApron .45s .35s cubic-bezier(.2, .9, .3, 1.3) both; }
[class*="fx-tier"] .crn, [class*="fx-tier"] .hat { transform-origin: 50% 100%; animation: lvCrown .65s .35s cubic-bezier(.3, 1.4, .5, 1) both; }
[class*="fx-tier"] .beam { transform-origin: 50% 0; animation: lvBeam .6s .1s cubic-bezier(.2, .8, .3, 1) both; }
[class*="fx-tier"] .aura { transform-origin: 50% 60%; animation: lvAura 2.6s .9s ease-in-out infinite both; }
[class*="fx-tier"] .rise { animation: lvRise 1s .25s cubic-bezier(.2, .8, .3, 1) both, lvFloat 3s 1.25s ease-in-out infinite; }
[class*="fx-tier"] .mote { animation: lvMote 2.2s var(--d) ease-in infinite both; }
[class*="fx-tier"] .swirl { transform-origin: center; animation: lvSwirlIn .7s .15s cubic-bezier(.2, .9, .3, 1.2) both, lvSwirl 3.2s .9s ease-in-out infinite alternate; }
[class*="fx-tier"] .crank { transform-origin: 8% 50%; animation: lvCrank 1.1s .4s cubic-bezier(.4, 0, .3, 1) both; }
@keyframes lvSeed { from { transform: translateY(5px) scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lvDrip { from { transform: translateY(-9px); opacity: 0; } 30% { opacity: 1; } 80% { transform: translateY(1px) scale(1.1, .85); } to { transform: none; opacity: 1; } }
@keyframes lvGrow { from { transform: scale(.2, 0); } 70% { transform: scale(1.04, 1.06); } to { transform: none; } }
@keyframes lvBloom { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lvDrop { from { transform: translateY(-45%); opacity: 0; } 55% { transform: translateY(0) scale(1.08, .9); opacity: 1; } to { transform: none; } }
@keyframes lvSteam { from { opacity: 0; transform: translateY(3px); } 45% { opacity: 1; } to { opacity: .85; transform: translateY(-1px); } }
@keyframes lvApron { from { transform: scaleY(0); } to { transform: none; } }
@keyframes lvCrown { from { transform: translateY(-140%) rotate(-14deg); opacity: 0; } 55% { opacity: 1; } 75% { transform: translateY(6%) rotate(3deg); } to { transform: none; opacity: 1; } }
@keyframes lvBeam { from { transform: scaleY(0); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lvAura { 0%, 100% { transform: scale(.94); opacity: .7; } 50% { transform: scale(1.05); opacity: 1; } }
@keyframes lvRise { from { transform: translateY(40%); opacity: 0; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes lvFloat { 0%, 100% { transform: none; } 50% { transform: translateY(-5%); } }
@keyframes lvMote { from { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(-900%); opacity: 0; } }
@keyframes lvSwirlIn { from { transform: scale(.4) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes lvSwirl { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes lvCrank { from { transform: rotate(0); } to { transform: rotate(360deg); } }
/* 메뉴 레벨 칸: 왼쪽 단계 그림(누르면 레벨 단계), 오른쪽 레벨과 원두(누르면 원두 기록) */
.xlv.xlvcard { flex-direction: row; align-items: center; gap: 12px; }

.xlv .top .lvb { font-size: inherit; }
em.tnm { font-style: normal; font-size: 13.5px; font-weight: 800; color: var(--pri); white-space: nowrap; }
/* 레벨 단계 창 */
.xbox.tiers { width: min(380px, 100%); }
.ttop { display: flex; align-items: center; gap: 14px; margin-top: 4px; padding: 12px 16px 12px 10px; border-radius: 16px; background: color-mix(in srgb, var(--pri) 8%, var(--surface)); }

.ttop .ttx span { margin-top: 2px; font-size: 12.5px; color: var(--ink-3); }
.tdex { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-top: 6px; }
.tcard { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px 9px; border-radius: 14px; background: var(--surface-2); }
.tcard .tart { width: 58px; height: 58px; display: grid; place-items: center; }
.tcard .tart .fxs { width: 58px; height: 58px; vertical-align: 0; }
.tcard b { min-height: 2.5em; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; line-height: 1.25; text-align: center; word-break: keep-all; }
.tcard small { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tcard.got { background: color-mix(in srgb, var(--pri) 7%, var(--surface)); }
.tcard.now { background: color-mix(in srgb, var(--pri) 13%, var(--surface)); box-shadow: inset 0 0 0 1.8px var(--pri); }
.tcard .tnow { position: absolute; top: 5px; right: 5px; padding: 0 6px; border-radius: 999px; background: var(--pri); color: #fff; font-size: 10px; font-weight: 800; line-height: 16px; }
.tcard.next b, .tcard.lock b { color: var(--ink-3); }
.tcard.next .tart .fx, .tcard.lock .tart .fx { filter: brightness(0); opacity: .14; }
.tcard.lock { background: none; box-shadow: inset 0 0 0 1px var(--line); }
/* 랭킹 줄과 사람 창, 원두 기록의 단계 그림 */
.rkl .rkt { flex: none; width: 28px; height: 28px; }
.rkl .rkt .fxs { width: 28px; height: 28px; vertical-align: 0; }
.xbox.person .pslv { align-items: center; }
.xbox.person .pslv .psl { display: inline-flex; align-items: center; gap: 8px; }
.xbox.person .pslv .psl .fxs { width: 40px; height: 40px; vertical-align: 0; }
.xlsum .xls { display: inline-flex; align-items: baseline; gap: 7px; }
/* 레벨 업에서 단계가 오를 때: 지난 단계 그림이 흔들리며 빛나다가 번쩍, 새 단계 그림이 나온다 */
#lvup .lart.tup { position: relative; width: 132px; }
#lvup .lart.tup > .fx.still { animation: tupShake .9s ease-in-out both; }
#lvup .lart.morph::before { content: ""; position: absolute; left: 50%; top: 50%; width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .95), rgba(255, 255, 255, 0) 65%); animation: tupFlash .6s ease-out forwards; pointer-events: none; z-index: 1; }
#lvup .tierup { margin-top: 6px; padding: 6px 16px; border-radius: 999px; background: rgba(255, 224, 102, .18); color: #ffe066; font-size: 16px; font-weight: 800; animation: lvRise .5s 1.15s both; }
@keyframes tupShake { 0% { transform: none; } 20% { transform: rotate(-6deg) scale(1.02); } 40% { transform: rotate(6deg) scale(1.05); } 60% { transform: rotate(-5deg) scale(1.08); filter: brightness(1.3); } 100% { transform: scale(1.15); filter: brightness(2.4); } }
@keyframes tupFlash { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }

/* 새 동네 지도 메뉴 그림: 접힌 종이 지도가 펴지고 도장이 찍힌다 */
.fx-mi_map .mp { transform-origin: center; animation: mpOpen .5s cubic-bezier(.2, .9, .3, 1.2) both; }
.fx-mi_map .stp { transform-origin: center; animation: dmInk .38s .42s cubic-bezier(.2, .9, .3, 1.5) both; }
@keyframes mpOpen { from { transform: scaleX(.22); opacity: 0; } 35% { opacity: 1; } to { transform: scaleX(1); opacity: 1; } }
@keyframes dmInk { from { transform: scale(1.9) rotate(-30deg); opacity: 0; } to { transform: scale(1) rotate(-12deg); opacity: 1; } }

/* 브랜드 도감 그림: 컵이 톡 나와 깡충, 별이 돌며 붙는다. 세 컵은 차례로. 도감 책은 표지의 컵이 흔들린다. */
.fx-brand .dc, .fx-dexcup .dc { transform-origin: center bottom; animation: fxPop .35s cubic-bezier(.2, .9, .3, 1.3) both, dcHop .45s .5s ease-out; }
.fx-brand .dst { transform-origin: center; animation: dxStar .4s .38s cubic-bezier(.2, .9, .3, 1.6) both; }
.fx-brands3 .c { transform-origin: center bottom; animation: fxPop .35s var(--d) cubic-bezier(.2, .9, .3, 1.4) both, dcHop .45s var(--e) ease-out; }
.fx-mi_dex .bk { transform-origin: center bottom; animation: fxPop .35s cubic-bezier(.2, .9, .3, 1.3) both; }
.fx-mi_dex .em { transform-origin: center; animation: fxPop .3s .18s cubic-bezier(.2, .9, .3, 1.6) both, dxWig .5s .5s ease-in-out; }
@keyframes dcHop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-9%) scale(1.03, .97); } }
@keyframes dxStar { from { transform: scale(0) rotate(-60deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes dxWig { 30% { transform: rotate(-10deg); } 70% { transform: rotate(8deg); } }

/* 1. 첫 도장: 내려와 쾅 찍고, 들려서 카드 위에 비스듬히 남는다 */
.fx-stamp .card { transform-origin: center bottom; animation: fxPop .35s cubic-bezier(.2, .9, .3, 1.3) both, stHit .3s .66s ease-out; }
.fx-stamp .tool { transform-origin: center bottom; animation: stTool 1.3s .2s cubic-bezier(.4, 0, .2, 1) both; }
@keyframes stTool {
  0% { transform: translate(0, -14px) rotate(-16deg); opacity: 0; }
  25% { transform: translate(0, -2px) rotate(-4deg); opacity: 1; }
  32% { transform: translate(0, -4px) rotate(0); animation-timing-function: cubic-bezier(.6, 0, 1, .6); }
  39% { transform: translate(0, 8.4px) scale(1.04, .86); }
  52% { transform: translate(0, 8px) scale(1); }
  78% { transform: translate(2.6px, -1.4px) rotate(11deg); }
  100% { transform: translate(2.6px, 0) rotate(11deg); opacity: 1; }
}
.fx-stamp .mark { transform-origin: center; animation: stMark .4s .68s cubic-bezier(.2, .9, .3, 1.6) both; }
.fx-stamp .burst line, .fx-stampfull .burst line { stroke: #FFB02E; stroke-width: .8; stroke-linecap: round; }
.fx-stamp .burst { transform-origin: center; animation: fxBurst .45s .68s ease-out both; }

/* 2. 쿠폰판 완성: 다섯 칸이 착착 차는 동안 도장이 위에서 기다리다가, 마지막 칸을 쾅 */
.fx-stampfull .card { transform-origin: center bottom; animation: fxPop .3s cubic-bezier(.2, .9, .3, 1.3) both, stHit .32s 1.05s ease-out; }
.fx-stampfull .m { transform-origin: center; animation: sfMark .26s var(--d) cubic-bezier(.2, .9, .3, 1.6) both; }
@keyframes sfMark { from { transform: scale(1.8) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(-10deg); opacity: 1; } }
.fx-stampfull .m6 { transform-origin: center; animation: stMark .4s 1.07s cubic-bezier(.2, .9, .3, 1.6) both; }
.fx-stampfull .burst { transform-origin: center; animation: fxBurst .45s 1.07s ease-out both; }
.fx-stampfull .burst line { stroke-width: .7; }
.fx-stampfull .tool { transform-origin: center bottom; animation: sfTool 1.5s .1s cubic-bezier(.4, 0, .2, 1) both; }
@keyframes sfTool {
  0% { transform: translate(0, -10px) rotate(-16deg); opacity: 0; }
  17% { transform: translate(0, -1px) rotate(-6deg); opacity: 1; }
  50% { transform: translate(0, 0) rotate(-3deg); }
  57% { transform: translate(0, -3px) rotate(0); animation-timing-function: cubic-bezier(.6, 0, 1, .6); }
  64% { transform: translate(0, 15.6px) scale(1.04, .86); }
  72% { transform: translate(0, 15.6px) scale(1); }
  88% { transform: translate(1.8px, -.8px) rotate(10deg); }
  100% { transform: translate(1.8px, 0) rotate(10deg); opacity: 1; }
}

/* 3, 4. 동네 지도: 지도가 뜨고, 핀이 꽂히는 칸이 칠해진다 */
.fx-town .map, .fx-towns .map { transform-origin: center; animation: fxPop .35s cubic-bezier(.2, .9, .3, 1.3) both; }
.fx-town .icons, .fx-towns .icons { transform-origin: center; animation: fxPop .35s .12s cubic-bezier(.2, .9, .3, 1.3) both; }
.fx-town .fill, .fx-towns .fill { transform-origin: center; opacity: 0; animation: twFill .4s var(--d) cubic-bezier(.2, .9, .3, 1.4) both; }
@keyframes twFill { from { transform: scale(.2); opacity: 0; } 60% { opacity: .95; } to { transform: scale(1); opacity: .92; } }
.fx-town .pn { transform-origin: center bottom; animation: twPin .62s .05s cubic-bezier(.55, 0, .9, .45) both, twLand .35s .62s ease-out; }
@keyframes twPin { from { transform: translateY(-20px); opacity: 0; } 25% { opacity: 1; } to { transform: translateY(0); opacity: 1; } }
@keyframes twPin2 { from { transform: translateY(-12px); opacity: 0; } 25% { opacity: 1; } to { transform: translateY(0); opacity: 1; } }
@keyframes twLand { 30% { transform: scale(1.15, .8); } 65% { transform: scale(.95, 1.06); } 100% { transform: scale(1); } }
.fx-town .psh { transform-origin: center; animation: twSh .62s .05s ease-in both; }
@keyframes twSh { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
/* 동네 보너스: 핀 셋이 차례로, 그 사이를 점선 길이 잇는다 */
.fx-towns .map { animation: fxPop .35s cubic-bezier(.2, .9, .3, 1.3) both, sfJump .4s 1.5s ease-out; }
@keyframes sfJump { 35% { transform: translateY(-1.6px) scale(1.02, .97); } 100% { transform: none; } }
.fx-towns .pn { transform-origin: center bottom; animation: twPin2 .42s var(--d) cubic-bezier(.55, 0, .9, .45) both, twLand .35s var(--e) ease-out; }
.fx-towns .psh { transform-origin: center; animation: twSh .42s var(--d) ease-in both; }
.fx-towns .ft { opacity: 0; transform-origin: center; animation: twFt .22s var(--d) ease-out both; }
@keyframes twFt { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.fx-towns .pt { transform-origin: center; opacity: 0; animation: twPt .4s var(--d) cubic-bezier(.2, .9, .3, 1.5) both; }
@keyframes twPt { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: .95; } }

/* 5. 개업 리본 커팅 */
.fx-shop .shop { transform-origin: center bottom; animation: shUp .4s cubic-bezier(.2, .9, .3, 1.3) both; }
@keyframes shUp { from { transform: scaleY(.2); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
.fx-shop .rl, .fx-shop .rr, .fx-shop .bow { animation: fxPop .3s .2s both; transform-origin: center; }
.fx-shop .rl { transform-origin: left center; animation: fxPop .3s .2s both, shFallL .45s .78s cubic-bezier(.5, 0, .7, 1) forwards; }
.fx-shop .rr { transform-origin: right center; animation: fxPop .3s .2s both, shFallR .45s .78s cubic-bezier(.5, 0, .7, 1) forwards; }
@keyframes shFallL { to { transform: rotate(62deg); } }
@keyframes shFallR { to { transform: rotate(-62deg); } }
.fx-shop .bow { animation: fxPop .3s .2s both, shBow .5s .78s ease-in forwards; }
@keyframes shBow { to { transform: translateY(6px) rotate(40deg); opacity: 0; } }
.fx-shop .snip line { stroke: #F8312F; stroke-width: .7; stroke-linecap: round; }
.fx-shop .snip { transform-origin: center; animation: fxBurst .4s .78s ease-out both; }
.fx-shop .sc { animation: shSc 1.25s .3s cubic-bezier(.3, .7, .3, 1) both; }
@keyframes shSc { 0% { transform: translate(10px, -7px) rotate(-20deg); opacity: 0; } 28% { transform: translate(0, 0) rotate(0); opacity: 1; } 62% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(9px, -9px) rotate(18deg); opacity: 0; } }
.fx-shop .bu { transform-origin: 8.2px 4px; animation: shBu .25s .58s ease-in both; }
.fx-shop .bl { transform-origin: 8.2px .9px; animation: shBl .25s .58s ease-in both; }
@keyframes shBu { from { transform: rotate(-18deg); } to { transform: rotate(2deg); } }
@keyframes shBl { from { transform: rotate(18deg); } to { transform: rotate(-2deg); } }

/* 6. 플러그 꽂기 */
.fx-plug .wall, .fx-plug .sock { transform-origin: center; animation: fxPop .3s cubic-bezier(.2, .9, .3, 1.3) both; }
.fx-plug .bat { transform-origin: center; animation: fxPop .3s .1s cubic-bezier(.2, .9, .3, 1.3) both; }
.fx-plug .plug { animation: plIn .45s .2s cubic-bezier(.55, 0, .8, .5) both, plBump .25s .65s ease-out; }
@keyframes plIn { from { transform: translateX(10px); opacity: 0; } 30% { opacity: 1; } to { transform: translateX(0); opacity: 1; } }
@keyframes plBump { 40% { transform: translateX(-.7px); } 100% { transform: none; } }
.fx-plug .zz { transform-origin: center; animation: plZap .9s .66s steps(1) both; }
@keyframes plZap { 0% { transform: scale(0); opacity: 0; } 10% { transform: scale(1.2); opacity: 1; } 25% { opacity: .2; } 40% { opacity: 1; transform: scale(1); } 55% { opacity: .3; } 70% { opacity: 1; } 100% { opacity: 1; transform: scale(1); } }
.fx-plug .bf { transform-origin: left center; animation: plFill .6s .75s cubic-bezier(.3, .7, .3, 1) both; }
@keyframes plFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* 7. 달력 */
.fx-cal .cb { transform-origin: center bottom; animation: fxPop .35s cubic-bezier(.2, .9, .3, 1.3) both; }
.fx-cal .pg { transform-origin: center top; animation: clFlip .22s var(--d) ease-in both; }
@keyframes clFlip { from { transform: scaleY(1); opacity: 1; } 90% { opacity: 1; } to { transform: scaleY(0) skewX(8deg); opacity: 0; } }
.fx-cal .ok path { stroke-dasharray: 14; stroke-dashoffset: 14; animation: fxDraw .3s 1.05s ease-out forwards; }
@keyframes fxDraw { to { stroke-dashoffset: 0; } }

/* 8. 종이비행기: 곡선 한 줄기를 따라 고르게 난다(잘게 뽑은 자리 사이를 일정하게 이어서 멈칫거림이 없다) */

@keyframes pnTrail { to { stroke-dashoffset: 0.30; } }
.fx-plane .pl { transform-box: view-box; transform-origin: 0 0; animation: pnFly 1.15s 0.15s linear both; }

  22.5% { transform: translate(7.08px, 26.68px) rotate(15.2deg) scale(1.000); opacity: 1.00; }

/* 9. 컵에 이름 쓰기 */
.fx-cup .cupb { transform-origin: center bottom; animation: fxPop .35s cubic-bezier(.2, .9, .3, 1.3) both; }
.fx-cup .nm { stroke-dasharray: 34; stroke-dashoffset: 34; animation: fxDraw .75s .45s linear forwards; }
.fx-cup .pen { transform-box: view-box; transform-origin: 0 0; animation: cpPen 1.25s .2s ease-in-out both; }
@keyframes cpPen {

  30% { transform: translate(12.30px, 12.05px); }
  40% { transform: translate(14.48px, 14.37px); }

}

/* 10. 라떼 하트 */
.fx-latte .mug { transform-origin: center; animation: fxPop .35s cubic-bezier(.2, .9, .3, 1.3) both; }
.fx-latte .art { transform-origin: center; animation: ltArt .6s .3s cubic-bezier(.2, .9, .3, 1.3) both, ltBeat .5s 1.05s ease-in-out; }
@keyframes ltArt { from { transform: scale(0) rotate(-200deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes ltBeat { 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
.fx-latte .hp { transform-origin: center; animation: ltHp .9s .85s cubic-bezier(.2, .9, .3, 1.3) both; }
@keyframes ltHp { 0% { transform: translate(-6px, 6px) scale(0); opacity: 0; } 40% { transform: translate(0, 0) scale(1.15); opacity: 1; } 70% { transform: scale(.95); } 100% { transform: scale(1); opacity: 1; } }

/* 새로 연 카페 보너스: 가게 셋이 서고, 가위가 리본을 차례로 자른다. 마지막에 거리 전체가 들썩 */
.fx-shops3 .st { transform-origin: center bottom; animation: sfJump .4s 1.48s ease-out; }
.fx-shops3 .sh { transform-origin: center bottom; animation: shUp .4s var(--d) cubic-bezier(.2, .9, .3, 1.3) both; }
.fx-shops3 .rl { transform-origin: left center; }
.fx-shops3 .rr { transform-origin: right center; }
.fx-shops3 .bw { transform-origin: center; }
.fx-shops3 .sn line { stroke: #F8312F; stroke-width: .6; stroke-linecap: round; }

  // ----- 걷는 길 -----

  function clearRoute() {

  // Geoapify: 무료로 하루 3,000번. 걷기(mode=walk) 경로를 GeoJSON으로 준다(여러 줄 선이라 이어 붙인다).
  function walkGeoapify(from, to) {

      return fetch('https://api.openrouteservice.org/v2/directions/foot-walking?start=' + from[0] + ',' + from[1] + '&end=' + to[0] + ',' + to[1], { headers: { Authorization: ROUTE.ors } })
