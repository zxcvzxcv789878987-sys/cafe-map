<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카페 지도</title>
<!-- 검색 사이트에 잡히지 않게 한다. 주소를 아는 사람만 연다. -->
<meta name="robots" content="noindex, nofollow">
<!-- 휴대폰 홈 화면에 추가하면 앱처럼 꽉 찬 화면으로 열린다. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="카페 지도">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2314171c'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f59f0a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 배치: 화면 전체가 지도. 위에 검색창과 필터 칩 한 줄만 떠 있다.
   그 밖의 것(지역 고르기, 브랜드 고르기, 목록, 카페 정보)은 필요할 때만 뜨는 카드 하나에 번갈아 나온다.
   PC에서는 카드가 왼쪽 위에, 휴대폰에서는 아래에서 올라온다. */
:root {
  --bg: #f1f3f6;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --ink: #14171c;
  --ink-2: #4b5462;
  --ink-3: #8b93a1;
  --line: #e7eaee;
  --line-2: #d3d8df;
  --inv: #14171c;
  --on-inv: #ffffff;
  --c-low: #f59f0a;
  --c-fr: #2463eb;
  --c-ind: #8a5a3c;
  --ok: #0f8a5a;
  --hi: #1d5fe0;
  --area: #6a5ae0;   /* 고른 지역을 칠하는 색. 카페 점(파랑, 주황, 갈색)이나 지도의 초록, 물색과 겹치지 않는 보라 */
  --sh-1: 0 1px 2px rgba(20, 23, 28, .10), 0 2px 10px rgba(20, 23, 28, .10);
  --sh-2: 0 2px 6px rgba(20, 23, 28, .08), 0 14px 36px rgba(20, 23, 28, .18);
  color-scheme: light;
  --font: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font); font-size: 14px; line-height: 1.45; color: var(--ink); background: var(--bg); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--c-fr); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#app { position: relative; height: 100%; }
#map { position: absolute; inset: 0; background: var(--bg); }
#dots { position: absolute; left: 0; top: 0; pointer-events: none; }

/* 위쪽 한 줄: 검색 + 칩 */
#bar { position: absolute; z-index: 20; top: 14px; left: 14px; right: 14px; display: flex; align-items: flex-start; gap: 10px; pointer-events: none; }
#bar > * { pointer-events: auto; }
.search { display: flex; align-items: center; gap: 8px; width: 300px; flex: none; height: 44px; padding: 0 6px 0 14px; background: var(--surface); border-radius: 14px; box-shadow: var(--sh-1); color: var(--ink-3); }
.search:focus-within { color: var(--ink); box-shadow: var(--sh-1), 0 0 0 2px var(--ink); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--ink); font-size: 15px; }
.search input::placeholder { color: var(--ink-3); }
.search input::-webkit-search-cancel-button { display: none; }
#qClear { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-3); }
#qClear:hover { background: var(--surface-2); color: var(--ink); }
#chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; padding-top: 3px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 999px; background: var(--surface); box-shadow: var(--sh-1); font-size: 14px; font-weight: 600; white-space: nowrap; flex: none; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed=true] { background: var(--inv); color: var(--on-inv); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.chip svg.i { width: 16px; height: 16px; }
.chip .sub { display: grid; place-items: center; width: 22px; height: 22px; margin-right: -7px; border-radius: 50%; opacity: .75; }
.chip .sub:hover { opacity: 1; background: rgba(128, 128, 128, .35); }
.chip.crumb { padding: 0 5px 0 12px; gap: 1px; cursor: default; }
.chip.crumb button { height: 28px; padding: 0 7px; border-radius: 999px; font-weight: 600; opacity: .68; display: inline-flex; align-items: center; gap: 3px; }
.chip.crumb button.cur { opacity: 1; }
.chip.crumb button:hover { opacity: 1; background: rgba(128, 128, 128, .32); }
.chip.crumb > svg.i { width: 12px; height: 12px; opacity: .5; }
.chip.crumb > svg.i:first-child { width: 16px; height: 16px; opacity: 1; margin-right: 3px; }
.chip.crumb button svg.i { width: 14px; height: 14px; }
.chip.ghost { background: none; box-shadow: none; color: var(--ink-2); padding: 0 8px; text-shadow: 0 0 6px var(--surface), 0 0 6px var(--surface); }
.chip.ghost:hover { color: var(--ink); }

/* 카드 하나: 메뉴, 목록, 카페 정보가 번갈아 나온다 */
#panel { position: absolute; z-index: 25; width: 360px; max-height: calc(100% - 96px); display: flex; flex-direction: column; background: var(--surface); border-radius: 18px; box-shadow: var(--sh-2); overflow: hidden; }
.ph { display: flex; align-items: center; gap: 6px; padding: 12px 10px 8px 16px; min-height: 52px; flex: none; }
.ph h2 { flex: 1; min-width: 0; margin: 0; font-size: 16px; font-weight: 750; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph h2 small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 6px; font-variant-numeric: tabular-nums; }
.ib { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); flex: none; }
.ib:hover { background: var(--surface-2); color: var(--ink); }
.ph .ib.back { margin-left: -8px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.sort { display: flex; background: var(--surface-2); border-radius: 9px; padding: 2px; flex: none; }
.sort button { font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 5px 10px; border-radius: 7px; }
.sort button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); }

.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 9px 16px; }
.row:hover { background: var(--surface-2); }
.pin { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 13px; font-weight: 750; background: var(--c); color: var(--t, #fff); }
.pin svg.i { width: 16px; height: 16px; }
.pin.logo { background: #fff; box-shadow: 0 0 0 2px var(--c); }
.pin.logo img { width: 68%; height: 68%; object-fit: contain; border-radius: 3px; }
.pin.logo.full img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row .name { font-weight: 650; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .tag { flex: none; color: var(--ok); display: grid; }
.row .tag svg.i { width: 16px; height: 16px; }
.sec { padding: 12px 16px 4px; font-size: 12px; font-weight: 650; color: var(--ink-3); letter-spacing: .03em; }
.note { margin: 0; padding: 8px 16px 10px; font-size: 12.5px; color: var(--ink-3); }
.ask { margin: 2px 14px 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-2); }
.ask .btn { flex: none; background: var(--inv); color: var(--on-inv); }
.empty { padding: 28px 24px 30px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty b { font-size: 15px; color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 11px; font-weight: 650; font-size: 14px; background: var(--surface-2); text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--line); }
.btn.pri { background: var(--inv); color: var(--on-inv); }
.btn.pri:hover { opacity: .88; background: var(--inv); }
.btn.sm { height: 34px; font-size: 13px; padding: 0 12px; }
.btn[aria-pressed=true] { background: var(--inv); color: var(--on-inv); }

.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 0 10px 8px; flex: none; }
.crumbs button { font-size: 13.5px; font-weight: 600; color: var(--ink-3); padding: 5px 6px; border-radius: 7px; }
.crumbs button:hover { background: var(--surface-2); color: var(--ink); }
.crumbs button.on { color: var(--ink); }
.crumbs svg.i { width: 13px; height: 13px; color: var(--ink-3); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 2px 14px 12px; }
.cell { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.cell:hover { border-color: var(--ink-3); }
.cell.on { background: var(--inv); border-color: var(--inv); color: var(--on-inv); }
.cell.on small { color: inherit; opacity: .7; }
.cell.all { grid-column: 1 / -1; }
/* 전국 단추: 다른 칸 두 개 너비로 길게 놓고, 한 단계 위라는 것이 보이게 옅은 보라 바탕을 깐다. */
.cell.nation { justify-content: center; background: rgba(106, 90, 224, .09); border-color: rgba(106, 90, 224, .28); color: var(--area); }
.cell.nation span { font-weight: 750; }
.cell.nation.on { background: var(--area); border-color: var(--area); color: #fff; }
.cell span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cell small { flex: none; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cell:disabled { opacity: .4; cursor: default; }

.inset { margin: 0 14px 6px; width: auto; height: 40px; box-shadow: none; background: var(--surface-2); flex: none; }
.inset:focus-within { box-shadow: 0 0 0 2px var(--ink); }
.pick { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px 16px; }
.pick:hover { background: var(--surface-2); }
.pick .box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex: none; color: transparent; }
.pick[aria-pressed=true] .box { background: var(--inv); border-color: var(--inv); color: var(--on-inv); }
.pick .box svg.i { width: 14px; height: 14px; stroke-width: 2.6; }
.pick .name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .pin { width: 28px; height: 28px; font-size: 12.5px; }
.brow { display: flex; align-items: center; }
.brow .pick { flex: 1; min-width: 0; padding-right: 6px; }
.pinbtn { width: 38px; height: 38px; display: grid; place-items: center; flex: none; margin-right: 8px; border-radius: 50%; color: var(--line-2); }
.pinbtn:hover { background: var(--surface-2); color: var(--ink-2); }
.pinbtn[aria-pressed=true] { color: var(--ink); }
.pinbtn[aria-pressed=true] svg.i { fill: currentColor; }
.pinbar { padding: 0 14px 8px; flex: none; display: flex; flex-direction: column; gap: 6px; }
.pinbar .btn { width: 100%; }
.pick small { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 12.5px; }

.pad { padding: 2px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.pad output { font-size: 20px; font-weight: 750; font-variant-numeric: tabular-nums; }
.pad output small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 6px; }
.pad p { margin: 0; font-size: 12.5px; color: var(--ink-3); }
input[type=range] { width: 100%; accent-color: var(--ink); margin: 0; }

.detail { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 12px; }
.detail h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1.3; overflow-wrap: anywhere; }
.kind { display: flex; align-items: center; gap: 7px; margin-top: 4px; color: var(--ink-2); font-size: 13.5px; font-weight: 550; }
.kind .dot { width: 9px; height: 9px; border-radius: 50%; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 0; align-items: center; }
.facts dt { color: var(--ink-3); font-size: 13px; }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.facts dd b { font-weight: 700; font-variant-numeric: tabular-nums; }
.facts dd small { color: var(--ink-3); font-size: 12.5px; }
.link { font-size: 12.5px; font-weight: 650; color: var(--ink-3); padding: 1px 6px; border-radius: 6px; }
.link:hover { background: var(--surface-2); color: var(--ink); }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 14px; height: 6px; border-radius: 3px; background: var(--line-2); }
.meter i.on { background: var(--ok); }
.mine { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--line); }
.mine span { font-size: 12.5px; color: var(--ink-3); margin-right: auto; }
/* 필터 카드: 위에 노트북 작업 조건, 아래에 브랜드. 브랜드의 탭과 검색은 목록을 내려도 위에 붙어 있다. */
.fsec { padding: 2px 16px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.fsec .sub { display: flex; flex-direction: column; gap: 8px; padding-bottom: 2px; }
.fsec .sub p { margin: 0; font-size: 12.5px; color: var(--ink-3); }
.fsec output { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.fsec output small { font-size: 12.5px; font-weight: 500; color: var(--ink-3); margin-left: 6px; }
.ftitle { font-size: 12px; font-weight: 650; color: var(--ink-3); letter-spacing: .03em; padding-top: 10px; }
.bhead { position: sticky; top: 0; z-index: 1; background: var(--surface); padding: 0 14px 8px; display: flex; flex-direction: column; gap: 8px; }
.bhead .ftitle { padding-left: 2px; }
.bhead .sort { display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 11px; padding: 3px; }
.bhead .sort button { height: 32px; font-size: 13px; border-radius: 8px; padding: 0 6px; }
.set { padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 9px; }
.set + .set { border-top: 1px solid var(--line); padding-top: 14px; }
.set h3 { margin: 4px 0 0; font-size: 12.5px; font-weight: 650; color: var(--ink-3); }
.set p { margin: 0; font-size: 12.5px; color: var(--ink-3); }
.set output { font-size: 17px; font-weight: 750; font-variant-numeric: tabular-nums; }
.set output small { font-size: 13px; font-weight: 500; color: var(--ink-3); margin-left: 6px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; font-weight: 650; font-size: 15px; }
.switch input { appearance: none; width: 42px; height: 24px; border-radius: 999px; background: var(--line-2); position: relative; margin: 0; cursor: pointer; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: var(--sh-1); transition: transform .15s; }
.switch input:checked { background: var(--ok); }
.switch input:checked::after { transform: translateX(18px); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 13px; font-weight: 600; }
.opt:hover { border-color: var(--ink-3); }
.opt[aria-pressed=true] { background: var(--inv); border-color: var(--inv); color: var(--on-inv); }
/* 단추 안에 적는 사람 수(그렇게 기록한 사람이 몇 명인지) */
.opt .n { margin-left: 6px; font-weight: 700; font-variant-numeric: tabular-nums; opacity: .5; }
.opt[aria-pressed=true] .n { opacity: .8; }
.rec { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); }
.rec .k { font-size: 13px; color: var(--ink-3); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
/* 카페 카드 안에 띄우는 카카오맵, 네이버지도 화면 */
/* 카페 카드: 얇은 머리줄(이름, 단추) 아래를 카카오맵의 그 가게 화면이 전부 차지한다.
   주소, 넓이, 콘센트 좌석 기록은 머리줄의 단추를 누르면 지도 위에 덮여 나온다. */
#panel[data-kind=detail][data-embed] { height: 100%; }
/* 머리줄: 맨 위 가운데의 손잡이 막대, 그 아래 왼쪽에 카페 아이콘과 종류, 오른쪽에 콘센트와 넓이를 적은 단추.
   머리줄을 잡고 아래로 쓸어내리면 카드가 내려가며 닫힌다. */
.dh { position: relative; display: flex; align-items: center; gap: 8px; padding: 16px 12px 10px 14px; flex: none; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.dh::before { content: ""; position: absolute; left: 50%; top: 6px; width: 38px; height: 4px; margin-left: -19px; border-radius: 2px; background: var(--line-2); }
.dh .pin { flex: none; }
.dh .kd { flex: 1; min-width: 0; font-size: 14px; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dh .ib { flex: none; }
/* 콘센트와 넓이를 한눈에 보여 주는 단추. 누르면 기록하는 판이 열린다. */
.sum { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 10px 0 12px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 13px; font-weight: 650; cursor: pointer; }
.sum:hover { border-color: var(--ink-3); }
.sum[aria-pressed=true] { background: var(--inv); border-color: var(--inv); color: var(--on-inv); }
.sum .st { display: inline-flex; align-items: center; gap: 5px; }
.sum .st i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.sum .st.yes i { background: var(--ok); }
.sum .st.no i { background: var(--ink-3); }
.sum .sz { color: var(--ink-3); font-variant-numeric: tabular-nums; padding-left: 7px; border-left: 1px solid var(--line-2); }
.sum[aria-pressed=true] .sz { color: inherit; opacity: .75; border-color: rgba(255, 255, 255, .3); }
.sum .i { width: 14px; height: 14px; opacity: .6; }
.none { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--ink-3); font-size: 13px; }
/* 카드는 아래에서 위로 올라오며 나타난다. */
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes cardUp { from { transform: translateY(32px); opacity: 0; } to { transform: none; opacity: 1; } }
#panel.rise { animation: cardUp .26s cubic-bezier(.2, .8, .2, 1); }
@media (max-width: 760px) { #panel.rise { animation: sheetUp .32s cubic-bezier(.2, .8, .2, 1); } }
@media (prefers-reduced-motion: reduce) { #panel.rise { animation: none; } }
.dbody { position: relative; flex: 1; min-height: 0; border-top: 1px solid var(--line); }
.dbody iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--surface-2); }

.dpop { position: absolute; left: 0; right: 0; top: 0; z-index: 2; max-height: 100%; overflow-y: auto; background: var(--surface); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; border-radius: 0 0 18px 18px; box-shadow: 0 12px 28px rgba(15, 20, 30, .22); }
@media (min-width: 761px) { #panel[data-kind=detail][data-embed] { width: 440px !important; } }

/* 아래쪽: 개수 단추, 지도 단추 */
#count { position: absolute; z-index: 15; left: 50%; bottom: 22px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 999px; background: var(--inv); color: var(--on-inv); font-weight: 650; box-shadow: var(--sh-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
#count:hover { opacity: .9; }
#count svg.i { width: 16px; height: 16px; }
#ctrl { position: absolute; right: 14px; bottom: 44px; z-index: 15; display: flex; flex-direction: column; gap: 8px; }
#nav { position: absolute; z-index: 15; right: 66px; bottom: 44px; display: flex; gap: 8px; }
#nav { pointer-events: none; }
#nav > * { pointer-events: auto; }
.nbtn { display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 16px 0 13px; border-radius: 12px; background: var(--surface); box-shadow: var(--sh-1); font-weight: 650; white-space: nowrap; }
.nbtn:hover, .nbtn[aria-pressed=true] { background: var(--inv); color: var(--on-inv); }
.cbtn { width: 42px; height: 42px; display: grid; place-items: center; background: var(--surface); border-radius: 12px; box-shadow: var(--sh-1); color: var(--ink); }
.cbtn:hover { background: var(--surface-2); }
.cgroup { display: flex; flex-direction: column; background: var(--surface); border-radius: 12px; box-shadow: var(--sh-1); overflow: hidden; }
.cgroup .cbtn { box-shadow: none; border-radius: 0; }
.cgroup .cbtn + .cbtn { border-top: 1px solid var(--line); }
#toast { position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%); z-index: 40; background: var(--inv); color: var(--on-inv); padding: 10px 16px; border-radius: 10px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--sh-2); }
.maplibregl-map { font-family: var(--font); }
.maplibregl-ctrl-attrib { background: color-mix(in srgb, var(--surface) 85%, transparent) !important; color: var(--ink-3); font-size: 11px; }
.maplibregl-ctrl-attrib a { color: var(--ink-3); }
/* 내 위치: 카페 점(파랑, 주황, 갈색)과 헷갈리지 않게 빨간 바탕에 사람 모양을 넣는다. */
.me { width: 28px; height: 28px; border-radius: 50%; background: #e5484d; border: 3px solid #fff; box-shadow: 0 0 0 7px rgba(229, 72, 77, .2), 0 2px 6px rgba(0, 0, 0, .3); display: grid; place-items: center; }

    sc.appendChild(grid); panel.appendChild(sc);
  }

  // ----- 필터: 걸러 보기와 설정을 카드 하나에 모았다. 위에 노트북 작업 조건, 아래에 브랜드 -----
  var brandQ = '';
  function toggleRow(label, on, fn) {
    var l = el('label', 'switch'), cb = el('input'); cb.type = 'checkbox'; cb.checked = on;
    cb.addEventListener('change', function () { fn(cb.checked); });
    l.appendChild(el('span', null, label)); l.appendChild(cb);
    return l;
  }
  function renderFilter() {
    var h = head('필터'), clear = btn('link', '모두 풀기', function () { resetFilter(); apply(); fillLap(); fillTabs(); fill(); });
    h.appendChild(clear); h.appendChild(closeBtn()); panel.appendChild(h);
    var sc = el('div', 'scroll'); panel.appendChild(sc);
    function apply() { refilter(); draw(); renderChips(); persist(); clear.hidden = !anyFilter(); }
    clear.hidden = !anyFilter();

    // 1. 노트북 작업: 대형카페, 콘센트 좌석. 켠 조건의 세부 설정만 그 아래에 펼친다.
    var lap = el('div', 'fsec'); sc.appendChild(lap);
    function fillLap() {
      lap.textContent = '';
      lap.appendChild(el('div', 'ftitle', '노트북 작업'));
      lap.appendChild(toggleRow('대형카페만', S.big, function (v) { S.big = v; apply(); fillLap(); }));
      if (S.big) {
        var a = el('div', 'sub'), out = el('output'), rg = el('input');
        rg.type = 'range'; rg.min = 30; rg.max = 300; rg.step = 10; rg.value = S.bigPy; rg.id = 'bigPy'; rg.setAttribute('aria-label', '대형카페 기준 평수');
        var lab = function () { out.textContent = S.bigPy + '평 이상'; out.appendChild(el('small', null, Math.round(S.bigPy * PYEONG) + '㎡ · 넓이를 모르는 카페는 빠져요')); };
        rg.addEventListener('input', function () { S.bigPy = +rg.value; lab(); apply(); });
        lab(); a.appendChild(out); a.appendChild(rg); lap.appendChild(a);
      }
      lap.appendChild(toggleRow('콘센트 좌석 있는 곳만', S.outlet, function (v) { S.outlet = v; apply(); fillLap(); }));
      if (S.outlet) {
        var b = el('div', 'sub'), row = el('div', 'opts');
        CHAIRS.forEach(function (c) {
          var bt = btn('opt', c[1], function () { if (S.chairs[c[0]]) delete S.chairs[c[0]]; else S.chairs[c[0]] = true; bt.setAttribute('aria-pressed', String(!!S.chairs[c[0]])); apply(); });
          bt.setAttribute('aria-pressed', String(!!S.chairs[c[0]]));
          row.appendChild(bt);
        });
        b.appendChild(row);
        b.appendChild(el('p', null, '지금까지 기록된 곳 ' + fmt(seatCount()) + '곳'));
        lap.appendChild(b);
      }
    }

    // 2. 브랜드: 묶음(전체, 저가커피, 내 브랜드)을 고르면 그 묶음의 브랜드만 목록에 나온다.
    var bh = el('div', 'bhead'), tabs = el('div', 'sort');
    bh.appendChild(el('div', 'ftitle', '브랜드')); bh.appendChild(tabs);
    var s = el('label', 'search inset'); s.appendChild(icon('search'));
    var inp = el('input'); inp.type = 'search'; inp.placeholder = '브랜드 이름'; inp.value = brandQ; inp.id = 'brandQ'; inp.autocomplete = 'off';
    s.appendChild(inp); bh.appendChild(s); sc.appendChild(bh);
    var list = el('div'); sc.appendChild(list);
    function fillTabs() {
      tabs.textContent = '';
      [['all', '전체'], ['low', '저가커피'], ['mine', '내 브랜드']].forEach(function (t) {
        var bt = btn(null, t[1], function () { if (S.tab === t[0]) return; setTab(t[0]); brandQ = inp.value = ''; apply(); fillTabs(); fill(); });
        bt.setAttribute('aria-pressed', String(S.tab === t[0]));
        tabs.appendChild(bt);
      });
    }
    // 한 줄: 왼쪽을 누르면 그 브랜드를 고르거나 빼고, 오른쪽 압정을 누르면 내 브랜드에 담거나 뺀다.
    function brandRow(j) {
      var label = D.brands[j][0], wrap = el('div', 'brow');
      var pk = btn('pick', null, function () { if (S.brands[j]) delete S.brands[j]; else S.brands[j] = true; pk.setAttribute('aria-pressed', String(S.brands[j] === true)); apply(); });
      pk.setAttribute('aria-pressed', String(S.brands[j] === true));
      pk.appendChild(brandPin(j, brandGroup[j], ''));
      pk.appendChild(el('span', 'name', label));
      pk.appendChild(el('small', null, fmt(brandCount[j])));
      var bx = el('span', 'box'); bx.appendChild(icon('check')); pk.appendChild(bx);
      wrap.appendChild(pk);
      var pinned = !!S.pins[label];
      var pb = btn('pinbtn', null, function () {
        if (S.pins[label]) { delete S.pins[label]; if (S.tab === 'mine') delete S.brands[j]; } else S.pins[label] = true;
        apply(); fill();
      });
      pb.setAttribute('aria-pressed', String(pinned));
      pb.setAttribute('aria-label', label + (pinned ? ' 내 브랜드에서 빼기' : ' 내 브랜드에 담기'));
      pb.title = pinned ? '내 브랜드에서 빼기' : '내 브랜드에 담기';
      pb.appendChild(icon('tack'));
      wrap.appendChild(pb);
      return wrap;
    }
    function fill() {
      list.textContent = '';
      var q = brandQ.replace(/\s/g, '').toLowerCase();
      var rows = tabList().filter(function (j) { return !q || D.brands[j][0].toLowerCase().indexOf(q) >= 0; });
      rows.sort(function (a, b) { return brandCount[b] - brandCount[a]; });
      if (S.tab === 'all' && !q) {
        // 전체에서는 프랜차이즈와 저가커피를 나눠서 보여 준다.
        [0, 1].forEach(function (g) {
          var part = rows.filter(function (j) { return brandGroup[j] === g; });
          if (!part.length) return;
          list.appendChild(el('div', 'sec', GROUPS[g].label));
          part.forEach(function (j) { list.appendChild(brandRow(j)); });
        });
      } else rows.forEach(function (j) { list.appendChild(brandRow(j)); });
      if (!rows.length) list.appendChild(el('p', 'note', q ? '그런 이름의 브랜드가 없어요.' : '브랜드 옆의 압정을 누르면 여기에 담겨요.'));
    }
    inp.addEventListener('input', function () { brandQ = inp.value; fill(); });
    fillLap(); fillTabs(); fill();
  }
  // ----- 카페 정보 -----
  function fullAddr(i) { var d = D.dongOf[i], g = dongSgg[d]; var sido = D.sido[sggSido[g]], sg = D.sgg[g][0]; return (sg === sido ? sido : sido + ' ' + sg) + ' ' + D.road[i]; }
  function selectCafe(i, pan, from) {
    sel = i; P.cafe = i; P.prev = from;
    // 지역을 골라 둔 채로 다른 동의 카페를 찾아가면, 지역을 그 카페의 동으로 바꿔서 주변 카페도 같이 보이게 한다.
    if (S.reg >= 0 && !regMask[D.dongOf[i]]) { S.reg = dongReg[D.dongOf[i]]; S.showAll = false; hoverPill = -1; refilter(); renderChips(); persist(); }
    var z = map.getZoom(), pt = map.project([D.lng[i] / 1e5, D.lat[i] / 1e5]), box = map.getContainer(), W = box.clientWidth, H = box.clientHeight;
    // 카드에 가려지지 않는 자리로 옮긴다. PC는 카드가 왼쪽, 휴대폰은 아래.
    var off = mobile.matches ? [0, -H * .2] : [180, 0];
    var hiddenByCard = mobile.matches ? pt.y > H * .42 : (pt.x < 400 && pt.y < H - 40);
    var outside = pt.x < 40 || pt.x > W - 40 || pt.y < (mobile.matches ? 130 : 90) || pt.y > H - 40;
    if (pan || outside || hiddenByCard || z < 13) map.easeTo({ center: [D.lng[i] / 1e5, D.lat[i] / 1e5], zoom: Math.max(z, pan ? 15.5 : 13.5), offset: off, duration: 500 });
    openPanel('detail'); requestDraw();
  }
  // 카페 카드. 머리줄(이름, 단추) 아래를 카카오맵의 그 가게 화면으로 꽉 채운다.
  // 주소, 넓이, 콘센트 좌석 기록은 머리줄의 "콘센트·넓이" 단추를 누르면 지도 위에 덮여 나온다.
  // 카카오 장소 번호가 없는 카페는 띄울 화면이 없어서, 그 내용을 카드에 바로 보여 준다.
  function renderDetail(i) {
    var b = D.brand[i], g = grp[i], a = D.area[i], fl = D.floor[i], lat = D.lat[i] / 1e5, lng = D.lng[i] / 1e5;
    var back = P.prev ? function () { var k = P.prev; sel = -1; P.prev = null; openPanel(k); requestDraw(); } : null;
    var pid = D.kid ? D.kid[i] : 0;
    // 머리줄에는 카페 이름을 적지 않는다(바로 아래 카카오맵 화면에 이름이 나온다). 지도의 점과 같은 아이콘, 그리고 종류만 둔다.
    var h = el('div', 'dh'), kd = el('span', 'kd', GROUPS[g].label);
    kd.style.color = 'var(' + GROUPS[g].css + ')';
    h.appendChild(pinEl(i)); h.appendChild(kd);
    sheetDrag(h);
    var dl = el('dl', 'facts'), addr = fullAddr(i);
    function fact(k) { dl.appendChild(el('dt', null, k)); var dd = el('dd'); dl.appendChild(dd); return dd; }
    var f1 = fact('주소'); f1.appendChild(el('span', null, addr + (fl > 0 ? ' ' + fl + '층' : fl < 0 ? ' 지하' : '')));
    var f2 = fact('넓이');
    if (a > 0) { f2.appendChild(el('b', null, pyeong(a) + '평')); f2.appendChild(el('small', null, fmt(a) + '㎡' + (a >= S.bigPy * PYEONG ? ' · 대형' : ''))); } else f2.appendChild(el('small', null, '자료 없음'));
    // 콘센트 좌석 기록. 투표처럼 단추마다 그렇게 기록한 사람 수를 적는다(아무도 안 했으면 0).
    // 눌린 단추가 내 기록이다. 자리 종류를 누르면 콘센트 좌석이 있다는 뜻이므로 "있어요"도 같이 켠다.
    var rec = el('div', 'rec'), r1 = el('div', 'opts'), r2 = el('div', 'opts');
    function voteBtn(text, fn) { var bt = btn('opt', text, fn), n = el('span', 'n', '0'); bt.appendChild(n); return [bt, n, text]; }
    function setBtn(x, on, count) {
      x[0].setAttribute('aria-pressed', String(on)); x[1].textContent = count;
      x[0].setAttribute('aria-label', x[2] + ', ' + count + '명이 기록' + (on ? ', 내 기록' : ''));
    }
    var yes = voteBtn('있어요', function () { myO[i] = myO[i] === 1 ? 0 : 1; store(); });
    var no = voteBtn('없어요', function () { myO[i] = myO[i] === -1 ? 0 : -1; store(); });
    r1.appendChild(yes[0]); r1.appendChild(no[0]);
    var chairBtns = CHAIRS.map(function (c) {
      var x = voteBtn(c[1], function () { if (myO[i] !== 1) { myO[i] = 1; myC[i] = 0; } myC[i] ^= c[2]; store(); });
      r2.appendChild(x[0]);
      return [x, c];
    });
    rec.appendChild(el('div', 'k', '콘센트 좌석')); rec.appendChild(r1);
    rec.appendChild(el('div', 'k', '자리 종류')); rec.appendChild(r2);
    function sync() {
      var v = votes[i] || [0, 0, 0, 0, 0];
      setBtn(yes, myO[i] === 1, v[0] + (myO[i] === 1 ? 1 : 0));
      setBtn(no, myO[i] === -1, v[1] + (myO[i] === -1 ? 1 : 0));
      chairBtns.forEach(function (cb) { var on = (myC[i] & cb[1][2]) !== 0; setBtn(cb[0], on, v[cb[1][3]] + (on ? 1 : 0)); });
    }
    function store() {
      if (myO[i] !== 1) myC[i] = 0;
      saveMine(i); tally(i); sync(); push(i);
      if (S.outlet) refilter();
      requestDraw(); sum();
    }
    sync();
    var sum = function () {};
    var body = null;
    if (pid) {
      // 지도 위에 덮이는 판. 단추를 다시 누르거나 판 바깥의 어두운 곳을 누르면 닫힌다.
      var scrim = el('div', 'dscrim'), pop = el('div', 'dpop');
      // 머리줄 오른쪽 단추: 콘센트 좌석이 있는지와 넓이를 바로 보여 주고, 누르면 판이 열린다.
      var info = btn('sum', null, function () { openPop(pop.hidden); }), st = el('span', 'st'), stText = el('span');
      st.appendChild(el('i')); st.appendChild(stText); info.appendChild(st);
      if (a > 0) info.appendChild(el('span', 'sz', pyeong(a) + '평'));
      info.appendChild(icon('down'));
      sum = function () {
        st.className = 'st' + (outlet[i] === 1 ? ' yes' : outlet[i] === -1 ? ' no' : '');
        stText.textContent = outlet[i] === 1 ? '콘센트 있어요' : outlet[i] === -1 ? '콘센트 없어요' : '콘센트';
      };
      sum();
      var openPop = function (on) { pop.hidden = scrim.hidden = !on; info.setAttribute('aria-pressed', String(on)); };
      info.setAttribute('aria-haspopup', 'dialog');
      scrim.addEventListener('click', function () { openPop(false); });
      pop.appendChild(dl); pop.appendChild(rec);
      var fr = document.createElement('iframe');
      fr.title = D.name[i] + ' 카카오맵'; fr.src = 'https://place.map.kakao.com/' + pid; fr.referrerPolicy = 'no-referrer';
      // 안에 띄운 화면이 이 지도 창 자체를 다른 곳으로 보내지 못하게 한다. 새 창 열기는 허용한다.
      fr.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms');
      body = el('div', 'dbody'); body.appendChild(fr); body.appendChild(scrim); body.appendChild(pop);
      openPop(false);
      h.appendChild(info);
      panel.setAttribute('data-embed', '');
    } else {
      // 카카오맵에 없는 카페: 띄울 화면이 없으므로 이름과 내용을 카드에 바로 적고, 없다는 것만 알린다.
      panel.removeAttribute('data-embed');
      body = el('div', 'scroll');
      var d = el('div', 'detail');
      d.appendChild(el('h1', null, D.name[i]));
      d.appendChild(el('p', 'none', '카카오맵에 없는 카페예요.'));
      d.appendChild(dl); d.appendChild(rec);
      body.appendChild(d);
    }
    if (back) { var bk = btn('ib back', null, back); bk.setAttribute('aria-label', '뒤로'); bk.appendChild(icon('back')); h.appendChild(bk); }
    panel.appendChild(h); panel.appendChild(body);
  }
  // 머리줄을 잡고 아래로 쓸어내리면 카드가 따라 내려가다가, 충분히 내렸거나 빠르게 내렸으면 닫힌다.
  function sheetDrag(h) {
    var on = false, y0 = 0, dy = 0, t0 = 0;
    h.addEventListener('pointerdown', function (e) {
      if (e.target.closest('button, a')) return;
      on = true; y0 = e.clientY; dy = 0; t0 = e.timeStamp;
      try { h.setPointerCapture(e.pointerId); } catch (err) { /* 잡지 못해도 계속한다 */ }
      panel.classList.remove('rise'); panel.style.transition = 'none';
    });
    h.addEventListener('pointermove', function (e) { if (!on) return; dy = Math.max(0, e.clientY - y0); panel.style.transform = 'translateY(' + dy + 'px)'; });
    function end(e) {
      if (!on) return;
      on = false;
      var fast = dy / Math.max(1, e.timeStamp - t0) > .6;
      panel.style.transition = 'transform .2s ease-out';
      if (dy > 110 || (fast && dy > 30)) {
        panel.style.transform = 'translateY(110%)';
        setTimeout(function () { closePanel(); panel.style.transition = panel.style.transform = ''; }, 190);
      } else {
        panel.style.transform = '';
        setTimeout(function () { panel.style.transition = ''; }, 210);
      }
    }
    h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
  }

  // ----- 지도 단추 -----
  var me = null;
  $('locate').addEventListener('click', function () { locateMe(); });
  function locateMe(done) {
    if (!navigator.geolocation) { toast('이 브라우저에서는 위치를 가져올 수 없어요.'); return; }
    navigator.geolocation.getCurrentPosition(function (p) {
      var ll = [p.coords.longitude, p.coords.latitude];
      if (!me) {
        var d = el('div', 'me'); d.title = '내 위치'; d.setAttribute('aria-label', '내 위치');
        d.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="4.2"/><path d="M3.5 21.5c0-4.7 3.8-8.2 8.5-8.2s8.500 3.500 8.500 8.200z"/></svg>';
        me = new maplibregl.Marker({ element: d }).setLngLat(ll).addTo(map);
      } else me.setLngLat(ll);
      myLoc = { x: (ll[0] + 180) / 360, y: mercY(ll[1]) };
      if (done) done(); else map.easeTo({ center: ll, zoom: Math.max(map.getZoom(), 15), duration: 600 });
    }, function () { toast('위치를 가져오지 못했어요. 브라우저에서 위치 권한을 허용해 주세요.'); }, { enableHighAccuracy: true, timeout: 10000 });
  }
  $('navAll').addEventListener('click', function () { S.showAll = !S.showAll; closePanel(); draw(); renderChips(); });
  $('navBack').addEventListener('click', function () { if (S.reg >= 0) { closePanel(); goRegion(rParent[S.reg]); } });
  $('navHome').addEventListener('click', function () { closePanel(); goRegion(-1); });
  $('zin').addEventListener('click', function () { userMove = true; map.zoomIn(); });
  $('zout').addEventListener('click', function () { userMove = true; map.zoomOut(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });
  mobile.addEventListener('change', function () { if (P.kind) placePanel(); draw(); });

  refilter(); draw(); renderChips();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { FONT = getComputedStyle(document.body).fontFamily; layoutCache = {}; draw(); });
})();
</script>
</body>
